<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>PictureDrip</title>
<style>
:root {
    --font-ui:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
    --c-muted:rgba(255,255,255,0.25);
    --c-hover:rgba(255,255,255,0.7);
    --c-accent:#38bdf8;
    --c-mode-btn:rgba(255,255,255,0.55);
    --c-mode-border:rgba(255,255,255,0.18);
    --c-mode-bg:rgba(255,255,255,0.06);
}
[data-theme="light"]{
    --c-muted:rgba(0,0,0,0.25);
    --c-hover:rgba(0,0,0,0.6);
    --c-accent:#4a5d78;
    --c-mode-btn:rgba(60,80,100,0.7);
    --c-mode-border:rgba(60,80,100,0.25);
    --c-mode-bg:rgba(60,80,100,0.07);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font-ui);}
body{background:linear-gradient(135deg,#05070a 0%,#0f131c 100%);transition:background 0.8s;}
[data-theme="light"] body{background:linear-gradient(135deg,#e8eae8 0%,#f5f5f3 100%);}

.drip-stage{position:absolute;inset:0;z-index:1;overflow:hidden;}
.float-layer{position:absolute;inset:0;}
.float-pic{position:absolute;border-radius:6px;object-fit:cover;opacity:0;transition:opacity 1.4s ease,transform 1.4s ease;box-shadow:0 8px 24px rgba(0,0,0,0.35);}
.slide-layer{position:absolute;inset:0;display:none;align-items:center;justify-content:center;}
.slide-pic{position:absolute;max-width:72%;max-height:80%;border-radius:8px;opacity:0;transition:opacity 1.4s ease;box-shadow:0 8px 30px rgba(0,0,0,0.4);}

.close-btn{position:fixed;top:16px;right:20px;z-index:1000;background:transparent;border:none;cursor:pointer;color:var(--c-muted);padding:6px;display:flex;align-items:center;justify-content:center;transition:color 0.2s;}
.close-btn:hover{color:var(--c-hover);}

.hud{position:fixed;bottom:24px;right:24px;z-index:1000;display:flex;align-items:center;gap:8px;}
.hud-btn{background:transparent;border:none;cursor:pointer;color:var(--c-muted);padding:5px;display:flex;align-items:center;justify-content:center;transition:color 0.2s;}
.hud-btn:hover{color:var(--c-hover);}
.hud-btn.active{color:var(--c-accent);}
.hud-sep{width:1px;height:14px;background:var(--c-muted);opacity:0.3;}

.hud-center{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:1000;}
.mode-btn{background:var(--c-mode-bg);border:1px solid var(--c-mode-border);color:var(--c-mode-btn);cursor:pointer;padding:7px 18px;border-radius:20px;display:flex;align-items:center;gap:7px;transition:all 0.2s;font-size:9px;letter-spacing:1.5px;font-family:var(--font-ui);backdrop-filter:blur(8px);}
.mode-btn:hover{color:var(--c-hover);border-color:var(--c-mode-btn);}

.slider-popup{position:fixed;bottom:64px;right:24px;z-index:999;background:rgba(10,14,22,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:16px 20px;display:none;flex-direction:column;gap:12px;min-width:200px;animation:popUpRight 0.18s ease;}
[data-theme="light"] .slider-popup{background:rgba(240,239,236,0.95);border:1px solid rgba(0,0,0,0.08);}
.slider-popup.open{display:flex;}
@keyframes popUpRight{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.sp-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.sp-label{font-size:8px;letter-spacing:1.5px;color:var(--c-muted);font-weight:700;text-transform:uppercase;white-space:nowrap;min-width:52px;}
.cs-wrap{position:relative;width:80px;height:14px;cursor:pointer;display:inline-block;touch-action:none;flex:none;}
.cs-track{position:absolute;top:50%;left:0;width:100%;height:2px;margin-top:-1px;background:rgba(128,128,128,0.2);border-radius:1px;}
.cs-thumb{position:absolute;top:50%;left:0;width:9px;height:9px;margin-top:-4.5px;margin-left:-4.5px;border-radius:50%;background:rgba(255,255,255,0.7);pointer-events:none;transition:left 0.05s;}
[data-theme="light"] .cs-thumb{background:rgba(0,0,0,0.5);}
</style>
</head>
<body>
<div class="drip-stage" id="dripStage">
    <div class="float-layer" id="floatLayer"></div>
    <div class="slide-layer" id="slideLayer">
        <img class="slide-pic" id="slidePicA">
        <img class="slide-pic" id="slidePicB">
    </div>
</div>

<button class="close-btn" onclick="window.close()" title="閉じる">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/>
    </svg>
</button>

<div class="hud-center">
    <button class="mode-btn" id="modeBtn">
        <svg id="iconFloat" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="2" width="6" height="5" rx="1"/>
            <rect x="6" y="8" width="6" height="5" rx="1"/>
            <rect x="10" y="3" width="5" height="4" rx="1"/>
        </svg>
        <svg id="iconSlide" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <rect x="2" y="3" width="9" height="10" rx="1.2"/>
            <rect x="5" y="1.5" width="9" height="10" rx="1.2" opacity="0.45"/>
        </svg>
        <span id="modeBtnLabel">FLOAT</span>
    </button>
</div>

<div class="hud">
    <button class="hud-btn" id="themeToggleBtn" title="ライト/ダーク">
        <svg id="ptL" width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
            <circle cx="9" cy="9" r="3.5"/>
            <line x1="9" y1="1" x2="9" y2="3"/><line x1="9" y1="15" x2="9" y2="17"/>
            <line x1="1" y1="9" x2="3" y2="9"/><line x1="15" y1="9" x2="17" y2="9"/>
            <line x1="3.2" y1="3.2" x2="4.6" y2="4.6"/><line x1="13.4" y1="13.4" x2="14.8" y2="14.8"/>
            <line x1="14.8" y1="3.2" x2="13.4" y2="4.6"/><line x1="4.6" y1="13.4" x2="3.2" y2="14.8"/>
        </svg>
        <svg id="ptD" width="16" height="16" viewBox="0 0 18 18" fill="currentColor" stroke="none" style="display:none;" opacity="0.85">
            <path d="M13 3 Q3 4 3 9 Q3 15 13 16 Q6 13 6 9 Q6 5 13 3 Z"/>
        </svg>
    </button>
    <div class="hud-sep"></div>
    <button class="hud-btn" id="settingsBtn" title="settings">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
            <line x1="2" y1="4.5" x2="14" y2="4.5"/><circle cx="9.5" cy="4.5" r="1.6" fill="currentColor" stroke="none"/>
            <line x1="2" y1="8" x2="14" y2="8"/><circle cx="6" cy="8" r="1.6" fill="currentColor" stroke="none"/>
            <line x1="2" y1="11.5" x2="14" y2="11.5"/><circle cx="11" cy="11.5" r="1.6" fill="currentColor" stroke="none"/>
        </svg>
    </button>
</div>

<div class="slider-popup" id="sliderPopup">
    <div class="sp-row"><span class="sp-label">密度</span><div class="cs-wrap" id="densitySlider"><div class="cs-track"></div><div class="cs-thumb"></div></div></div>
    <div class="sp-row"><span class="sp-label">速さ</span><div class="cs-wrap" id="speedSlider"><div class="cs-track"></div><div class="cs-thumb"></div></div></div>
    <div class="sp-row"><span class="sp-label">サイズ</span><div class="cs-wrap" id="sizeSlider"><div class="cs-track"></div><div class="cs-thumb"></div></div></div>
    <div class="sp-row"><span class="sp-label">ぼかし</span><div class="cs-wrap" id="blurSlider"><div class="cs-track"></div><div class="cs-thumb"></div></div></div>
</div>

<script>
(function(){
    const urlParams=new URLSearchParams(window.location.search);
    const initTheme=urlParams.get('theme')||'dark';
    document.documentElement.setAttribute('data-theme',initTheme);
    const root=document.documentElement;
    function isLight(){return root.getAttribute('data-theme')==='light';}

    let mode='float';
    let density=6,speed=1.0,size=240,blur=0;
    let picCounter=0;
    let metIds=null;

    async function fetchWithTimeout(url,ms){
        const controller=new AbortController();
        const timer=setTimeout(()=>controller.abort(),ms);
        try{
            return await fetch(url,{signal:controller.signal});
        }finally{
            clearTimeout(timer);
        }
    }

    async function getMetIds(){
        if(metIds)return metIds;
        try{
            const res=await fetchWithTimeout('https://collectionapi.metmuseum.org/public/collection/v1/search?hasImages=true&q=art',5000);
            const data=await res.json();
            metIds=(data&&data.objectIDs)||[];
        }catch(e){metIds=[];}
        return metIds;
    }
    getMetIds();

    async function getMetImageUrl(){
        const ids=await getMetIds();
        if(!ids.length)return null;
        for(let i=0;i<3;i++){
            const id=ids[Math.floor(Math.random()*ids.length)];
            try{
                const res=await fetchWithTimeout('https://collectionapi.metmuseum.org/public/collection/v1/objects/'+id,3000);
                const obj=await res.json();
                if(obj&&obj.primaryImageSmall)return obj.primaryImageSmall;
            }catch(e){}
        }
        return null;
    }

    async function getRandomImageUrl(w,h){
        picCounter++;
        const picsumUrl='https://picsum.photos/'+w+'/'+h+'?random='+picCounter;
        const metUrl=await getMetImageUrl().catch(()=>null);
        return metUrl||picsumUrl;
    }

    let floatTimer=null;
    async function spawnFloatPic(){
        const w=Math.round(size*(0.7+Math.random()*0.5));
        const h=Math.round(w*0.72);
        const url=await getRandomImageUrl(w,h);
        const img=document.createElement('img');
        img.className='float-pic';
        img.style.width=w+'px';
        img.style.height=h+'px';
        img.style.left=(Math.random()*78)+'%';
        img.style.top=(Math.random()*72)+'%';
        img.style.filter=blur>0?('blur('+blur+'px)'):'none';
        img.style.transform='scale(0.88)';
        document.getElementById('floatLayer').appendChild(img);

        let settled=false;
        function showAndSchedule(){
            if(settled)return;settled=true;
            requestAnimationFrame(()=>{img.style.opacity='0.94';img.style.transform='scale(1)';});
            setTimeout(()=>{
                img.style.opacity='0';
                setTimeout(()=>img.remove(),1500);
            },2600/speed);
        }
        img.onload=showAndSchedule;
        img.onerror=async()=>{
            if(img.dataset.fallbackTried){img.remove();return;}
            img.dataset.fallbackTried='1';
            const retryUrl=await getMetImageUrl().catch(()=>null);
            picCounter++;
            img.src=retryUrl||('https://picsum.photos/'+w+'/'+h+'?random='+picCounter+'_fb');
        };
        setTimeout(()=>{if(!settled&&!img.complete)img.remove();},6000/speed);
        img.src=url;
    }
    function startFloat(){
        stopAll();
        document.getElementById('floatLayer').style.display='block';
        document.getElementById('slideLayer').style.display='none';
        spawnFloatPic();
        floatTimer=setInterval(spawnFloatPic,Math.max(350,1600/density/speed));
    }

    let slideTimer=null,slideToggle=false;
    async function advanceSlide(){
        const picA=document.getElementById('slidePicA'),picB=document.getElementById('slidePicB');
        const nextPic=slideToggle?picA:picB;
        const curPic=slideToggle?picB:picA;
        const url=await getRandomImageUrl(700,500);
        nextPic.style.filter=blur>0?('blur('+blur+'px)'):'none';
        nextPic.onerror=async()=>{
            if(nextPic.dataset.fallbackTried)return;
            nextPic.dataset.fallbackTried='1';
            const retryUrl=await getMetImageUrl().catch(()=>null);
            picCounter++;
            nextPic.src=retryUrl||('https://picsum.photos/700/500?random='+picCounter+'_fb');
        };
        nextPic.onload=()=>{
            nextPic.style.opacity='1';
            curPic.style.opacity='0';
        };
        delete nextPic.dataset.fallbackTried;
        nextPic.src=url;
        slideToggle=!slideToggle;
    }
    function startSlide(){
        stopAll();
        document.getElementById('floatLayer').style.display='none';
        document.getElementById('slideLayer').style.display='flex';
        slideToggle=false;
        advanceSlide();
        slideTimer=setInterval(advanceSlide,Math.max(1800,5000/speed));
    }

    function stopAll(){
        if(floatTimer)clearInterval(floatTimer);
        if(slideTimer)clearInterval(slideTimer);
        floatTimer=null;slideTimer=null;
        document.getElementById('floatLayer').innerHTML='';
    }

    function updateModeUI(){
        document.getElementById('iconFloat').style.display=mode==='float'?'block':'none';
        document.getElementById('iconSlide').style.display=mode==='slide'?'block':'none';
        document.getElementById('modeBtnLabel').textContent=mode==='float'?'FLOAT':'SLIDE';
        document.title=mode==='float'?'PictureDrip · ふわっと':'PictureDrip · スライド';
    }
    function updateThemeUI(){
        const light=isLight();
        document.getElementById('ptL').style.display=light?'block':'none';
        document.getElementById('ptD').style.display=light?'none':'block';
    }

    document.getElementById('modeBtn').addEventListener('click',()=>{
        mode=mode==='float'?'slide':'float';
        updateModeUI();
        if(mode==='float')startFloat();else startSlide();
    });
    document.getElementById('themeToggleBtn').addEventListener('click',()=>{
        root.setAttribute('data-theme',isLight()?'dark':'light');
        updateThemeUI();
    });
    document.getElementById('settingsBtn').addEventListener('click',e=>{
        e.stopPropagation();
        const popup=document.getElementById('sliderPopup');
        const isOpen=popup.classList.toggle('open');
        document.getElementById('settingsBtn').classList.toggle('active',isOpen);
        if(isOpen)setTimeout(initSliders,30);
    });
    document.addEventListener('click',e=>{
        if(!e.target.closest('#sliderPopup')&&!e.target.closest('#settingsBtn')){
            document.getElementById('sliderPopup').classList.remove('open');
            document.getElementById('settingsBtn').classList.remove('active');
        }
    });

    let slidersInited=false;
    function makeSlider(id,opts){
        const el=document.getElementById(id);if(!el)return;
        const thumb=el.querySelector('.cs-thumb');
        const{min,max,step,value:iv,onInput}=opts;
        function setFromVal(v){
            const pct=(v-min)/(max-min);
            thumb.style.left=(pct*100)+'%';
        }
        setFromVal(iv);
        function setFromX(clientX){
            const rect=el.getBoundingClientRect();
            let pct=(clientX-rect.left)/rect.width;
            pct=Math.max(0,Math.min(1,pct));
            let v=min+pct*(max-min);
            v=Math.round(v/step)*step;
            setFromVal(v);
            onInput(v);
        }
        el.addEventListener('pointerdown',e=>{
            el.setPointerCapture(e.pointerId);
            setFromX(e.clientX);
            const move=ev=>setFromX(ev.clientX);
            const up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);};
            el.addEventListener('pointermove',move);
            el.addEventListener('pointerup',up);
        });
    }
    function initSliders(){
        if(slidersInited)return;slidersInited=true;
        makeSlider('densitySlider',{min:3,max:12,step:1,value:density,onInput:v=>{density=v;if(mode==='float')startFloat();}});
        makeSlider('speedSlider',{min:0.4,max:2.2,step:0.1,value:speed,onInput:v=>{speed=v;if(mode==='float')startFloat();else startSlide();}});
        makeSlider('sizeSlider',{min:120,max:360,step:10,value:size,onInput:v=>{size=v;}});
        makeSlider('blurSlider',{min:0,max:8,step:1,value:blur,onInput:v=>{blur=v;}});
    }

    updateModeUI();updateThemeUI();startFloat();

    const watcher=setInterval(()=>{try{if(window.opener&&window.opener.closed){stopAll();clearInterval(watcher);window.close();}}catch(e){}},1000);
    window.addEventListener('beforeunload',()=>{stopAll();clearInterval(watcher);});
})();
</script>
</body>
</html>
