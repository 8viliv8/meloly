<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PON / CUT — Studio v0.7.2</title>
<style>
:root{--bg:#f5f5f7;--surface:#fff;--surface2:#f0f0f3;--text:#111114;--muted:#74747c;--line:#d9d9df;--accent:#0a84ff;--rec:#ff453a;--take:#ecf7ff;--clip:#dff1ff;--shadow:0 8px 28px rgba(0,0,0,.07);--r:18px}
@media(prefers-color-scheme:dark){:root{--bg:#000;--surface:#1c1c1e;--surface2:#2c2c2e;--text:#f5f5f7;--muted:#98989f;--line:#3a3a3c;--accent:#0a84ff;--rec:#ff453a;--take:#112333;--clip:#10314f;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;overflow-x:hidden}
button,input,select{font:inherit}button{min-height:44px}input,select{-webkit-user-select:auto;user-select:auto}
.app{max-width:760px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 16px}.brand{font-weight:700;letter-spacing:.09em;font-size:15px}.ver{font-size:11px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.grow{flex:1}.small{font-size:11px;color:var(--muted)}
button,.file,select,input[type=number]{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:999px;padding:9px 13px}
button:disabled{opacity:.35}.file input{display:none}.primary{background:var(--accent);border-color:var(--accent);color:white}.danger{background:var(--rec);border-color:var(--rec);color:white}.ghost{background:transparent}
.waveWrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);touch-action:none}
.waveWrap.main{height:170px;margin-top:12px}.waveWrap.take{height:112px;background:var(--take);margin-top:9px}
canvas{display:block;width:100%;height:100%}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none;will-change:transform}
.sel{position:absolute;top:0;bottom:0;background:rgba(10,132,255,.15);border-left:2px solid var(--accent);border-right:2px solid var(--accent);display:none;pointer-events:none}
.selHandle{position:absolute;top:0;bottom:0;width:18px;margin-left:-9px;display:none;z-index:5;touch-action:none}
.selHandle:after{content:"";position:absolute;left:7px;top:16px;bottom:16px;width:4px;border-radius:999px;background:var(--accent)}
.hint{position:absolute;left:9px;top:8px;font-size:10px;color:var(--muted);background:color-mix(in srgb,var(--surface) 84%,transparent);border-radius:999px;padding:4px 7px;pointer-events:none}
.transport{display:flex;align-items:center;gap:10px;margin-top:10px}.round{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center}.time{margin-left:auto;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.takeBlock{padding-top:14px;margin-top:14px;border-top:1px solid var(--line)}.takeHeader{display:flex;align-items:center;gap:8px}.takeName{font-weight:650;font-size:13px}.takeMeta{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.takeTransport{display:flex;align-items:center;gap:8px;margin-top:8px}.takeTransport .round{width:40px;height:40px}.takeTime{margin-left:auto;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.takeActions{display:flex;gap:7px;margin-top:8px}.takeActions button{flex:1}
.nudge{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.nudgeBox{background:var(--surface2);border-radius:12px;padding:8px}.nudgeTitle{font-size:10px;color:var(--muted);margin-bottom:5px}.nudgeRow{display:flex;gap:5px}.nudgeRow button{flex:1;min-height:36px;padding:6px 8px;font-size:11px}
.sectionTitle{font-size:12px;font-weight:700;letter-spacing:.06em;margin-bottom:9px}
.buildTools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tool{background:var(--surface2);border-radius:14px;padding:10px}.tool label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.tool input,.tool select{width:100%}
.timelineViewport{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface2);touch-action:pan-x}
.timeline{position:relative;min-width:1100px;height:286px;background:linear-gradient(to right,color-mix(in srgb,var(--line) 68%,transparent) 1px,transparent 1px),linear-gradient(to right,color-mix(in srgb,var(--line) 34%,transparent) 1px,transparent 1px);background-size:120px 100%,30px 100%}
.ruler{position:absolute;left:0;right:0;top:0;height:28px;border-bottom:1px solid var(--line);font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}.ruler span{position:absolute;top:7px;transform:translateX(4px)}
.lane{position:absolute;left:0;right:0;height:82px;border-bottom:1px solid var(--line)}.lane1{top:28px}.lane2{top:110px}.lane3{top:192px}
.clip{position:absolute;height:62px;top:10px;border-radius:10px;background:var(--clip);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));overflow:visible;touch-action:none;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.clip.selected{outline:2px solid var(--accent);outline-offset:1px}.clipInner{position:absolute;inset:0;overflow:hidden;border-radius:9px}.clip canvas{opacity:.78}.clipLabel{position:absolute;left:9px;top:6px;font-size:10px;font-weight:650;pointer-events:none}.clipPitch{position:absolute;right:8px;bottom:6px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);pointer-events:none}
.trimHandle{position:absolute;top:0;bottom:0;width:20px;z-index:6;touch-action:none}.trimHandle.left{left:-10px}.trimHandle.right{right:-10px}.trimHandle:after{content:"";position:absolute;top:14px;bottom:14px;width:4px;border-radius:999px;background:var(--accent)}.trimHandle.left:after{left:8px}.trimHandle.right:after{right:8px}
.buildHead{position:absolute;top:0;bottom:0;width:2px;background:var(--rec);z-index:4;pointer-events:none}
.inspector{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.inspector.show{display:block}.inspectorRow{display:flex;gap:8px;align-items:center}.pitchVal{min-width:72px;text-align:center;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}.inspectorRow button{flex:1}
.bottom{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom));z-index:20}.bottomIn{max-width:760px;margin:auto;display:flex;gap:8px}.bottomIn button{flex:1;font-weight:650}
.recDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:6px}.recBadge{display:none;color:var(--rec);font-size:11px;font-weight:700;margin-left:6px}.recBadge.on{display:inline}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="brand">PON / CUT</div><div class="ver">studio v0.7.2</div></div>

<div class="card">
  <div class="row"><label class="file"><input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.aif,.aiff,.flac">音源</label><button id="demo">DEMO</button><span id="status" class="small">音源未読込</span><span id="recBadge" class="recBadge">● REC</span></div>
  <div id="sourceWave" class="waveWrap main"><canvas></canvas><div class="playhead"></div><div class="hint">tap / drag</div></div>
  <div class="transport"><button id="play" class="round" disabled>▶</button><button id="stop" class="round" disabled>■</button><div class="time"><span id="now">00:00.000</span> / <span id="dur">00:00.000</span></div></div>
  <div id="takesHost"></div>
</div>

<div class="card">
  <div class="row"><div class="sectionTitle" style="margin:0">BUILD</div><div class="grow"></div><button id="buildPlay" disabled>▶</button><button id="buildStop" disabled>■</button></div>
  <div class="buildTools">
    <div class="tool"><label>GRID BPM（音は変えない）</label><input id="bpm" type="number" min="30" max="300" value="120"></div>
    <div class="tool"><label>SNAP</label><select id="snap"><option value="0">OFF</option><option value=".25">1/16</option><option value=".5">1/8</option><option value="1" selected>1/4</option></select></div>
  </div>
  <div class="timelineViewport"><div id="timeline" class="timeline"><div id="ruler" class="ruler"></div><div class="lane lane1" data-lane="0"></div><div class="lane lane2" data-lane="1"></div><div class="lane lane3" data-lane="2"></div><div id="buildHead" class="buildHead"></div></div></div>
  <div id="inspector" class="inspector">
    <div class="small" style="margin-bottom:7px">CLIP</div>
    <div class="inspectorRow"><button id="pitchDown">−1</button><div id="pitchVal" class="pitchVal">0 st</div><button id="pitchUp">+1</button></div>
    <div class="inspectorRow" style="margin-top:8px"><button id="duplicate">複製</button><button id="deleteClip">削除</button></div>
    <div class="small" style="margin-top:8px">クリップ端をドラッグ＝トリム / 本体ドラッグ＝移動 / 上下ドラッグ＝レーン変更。将来FXをこのCLIP単位に追加します。</div>
  </div>
</div>
</div>

<div class="bottom"><div class="bottomIn"><button id="rec" class="primary" disabled><span class="recDot"></span>TAKE</button></div></div>

<script>
'use strict';
const $=q=>document.querySelector(q),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let ac=null,master=null,captureDest=null,buffer=null,node=null,playing=false,startedAt=0,offsetAt=0;
let mediaRec=null,recChunks=[],recording=false,recStart=0,performanceEvents=[],takes=[],activeTakeSource=null,activeTakeId=null;
let build=[],selectedClip=null,buildSources=[],buildStartedAt=0,buildRAF=0;
const PX=120;

function ctx(){if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)throw Error('Web Audio API unavailable');ac=new A();master=ac.createGain();master.connect(ac.destination);captureDest=ac.createMediaStreamDestination();master.connect(captureDest)}if(ac.state==='suspended')ac.resume()}
function fmt(t){t=Math.max(0,t||0);let m=Math.floor(t/60),s=Math.floor(t%60),ms=Math.floor((t%1)*1000);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(ms).padStart(3,'0')}
function current(){if(!buffer)return 0;return playing?Math.min(buffer.duration,offsetAt+(ac.currentTime-startedAt)):offsetAt}
function stopSource(){if(node){try{node.onended=null;node.stop()}catch{}node=null}playing=false}
function playFrom(t,dur=null,log=true){if(!buffer)return;ctx();stopSource();offsetAt=clamp(t,0,Math.max(0,buffer.duration-.001));node=ac.createBufferSource();node.buffer=buffer;node.connect(master);startedAt=ac.currentTime;if(dur==null)node.start(0,offsetAt);else node.start(0,offsetAt,Math.min(dur,buffer.duration-offsetAt));playing=true;node.onended=()=>playing=false;if(recording&&log)performanceEvents.push({at:ac.currentTime-recStart,o:offsetAt,d:dur||.18})}
function seek(t){if(!buffer)return;const was=playing;offsetAt=clamp(t,0,buffer.duration);if(was)playFrom(offsetAt,null,true);else playFrom(offsetAt,.07,true)}

function drawWave(buf,wrap){const cv=wrap.querySelector('canvas'),r=wrap.getBoundingClientRect(),w=Math.max(1,r.width),h=Math.max(1,r.height),dpr=devicePixelRatio||1;cv.width=Math.floor(w*dpr);cv.height=Math.floor(h*dpr);const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);if(!buf)return;const d=buf.getChannelData(0),step=Math.max(1,Math.floor(d.length/w));g.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--text');g.globalAlpha=.88;g.beginPath();for(let x=0;x<w;x++){let p=x*step,mn=1,mx=-1;for(let j=0;j<step&&p+j<d.length;j++){let v=d[p+j];if(v<mn)mn=v;if(v>mx)mx=v}g.moveTo(x,(1-mx)*h/2);g.lineTo(x,(1-mn)*h/2)}g.stroke();g.globalAlpha=1}
const sourceWrap=$('#sourceWave');
(function bindSource(){let active=false;const move=e=>{if(!active||!buffer)return;e.preventDefault();let r=sourceWrap.getBoundingClientRect(),t=clamp((e.clientX-r.left)/r.width,0,1)*buffer.duration;seek(t)};sourceWrap.addEventListener('pointerdown',e=>{if(!buffer)return;e.preventDefault();active=true;sourceWrap.setPointerCapture?.(e.pointerId);move(e)},{passive:false});window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',()=>active=false,{passive:false})})();

async function decodeFile(f){$('#status').textContent='読み込み中…';ctx();const ab=await f.arrayBuffer();let b;try{b=await ac.decodeAudioData(ab.slice(0))}catch(e){b=await new Promise((res,rej)=>ac.decodeAudioData(ab.slice(0),res,rej))}buffer=b;offsetAt=0;takes=[];build=[];selectedClip=null;$('#status').textContent=f.name;drawWave(buffer,sourceWrap);renderTakes();renderBuild();ui()}
$('#file').onchange=e=>{let f=e.target.files?.[0];if(f)decodeFile(f).catch(err=>$('#status').textContent='ERROR '+err.message)};
$('#demo').onclick=()=>{ctx();let sr=44100,b=ac.createBuffer(1,sr*8,sr),d=b.getChannelData(0);for(let i=0;i<d.length;i++){let t=i/sr,k=t%.5,v=0;if(k<.12)v+=Math.sin(2*Math.PI*(70+30*Math.exp(-k*12))*t)*Math.exp(-k*28)*.75;if(t%.25<.025)v+=(Math.random()*2-1)*.18*Math.exp(-(t%.25)*90);d[i]=v}buffer=b;offsetAt=0;takes=[];build=[];$('#status').textContent='DEMO';drawWave(buffer,sourceWrap);renderTakes();renderBuild();ui()};
$('#play').onclick=()=>{if(!buffer)return;if(playing){offsetAt=current();stopSource()}else playFrom(offsetAt,null,false)};$('#stop').onclick=()=>{stopSource();offsetAt=0};

function bestMime(){if(!window.MediaRecorder)return '';const opts=['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm'];return opts.find(x=>MediaRecorder.isTypeSupported?.(x))||''}
async function startTake(){if(!buffer)return;ctx();recording=true;performanceEvents=[];recStart=ac.currentTime;recChunks=[];const mime=bestMime();if(window.MediaRecorder&&captureDest){try{mediaRec=new MediaRecorder(captureDest.stream,mime?{mimeType:mime}:undefined);mediaRec.ondataavailable=e=>{if(e.data?.size)recChunks.push(e.data)};mediaRec.start(50)}catch(e){mediaRec=null}}ui()}
async function stopTake(){if(!recording)return;recording=false;const originalPos=current();stopSource();offsetAt=originalPos;ui();let raw=null;if(mediaRec&&mediaRec.state!=='inactive'){const mr=mediaRec;raw=await new Promise(resolve=>{mr.onstop=async()=>{try{const blob=new Blob(recChunks,{type:mr.mimeType||'audio/webm'}),ab=await blob.arrayBuffer();resolve(await ac.decodeAudioData(ab.slice(0)))}catch(e){resolve(null)}};mr.stop()})}if(!raw)raw=await renderFromEvents();if(raw){const t={id:crypto.randomUUID?.()||Math.random().toString(36),name:'TAKE '+(takes.length+1),buf:raw,events:performanceEvents.map(x=>({...x})),sel:[0,raw.duration],playPos:0,playing:false,loop:true};takes.push(t);renderTakes();ui();playTake(t,false)}}
async function renderFromEvents(){if(!performanceEvents.length)return null;const sr=buffer.sampleRate,total=Math.max(.2,performanceEvents.at(-1).at+.35),O=window.OfflineAudioContext||window.webkitOfflineAudioContext,oc=new O(1,Math.ceil(total*sr),sr);performanceEvents.forEach((h,i)=>{let nx=performanceEvents[i+1],dur=Math.max(.025,Math.min(h.d||.18,nx?nx.at-h.at:.18,buffer.duration-h.o));let s=oc.createBufferSource();s.buffer=buffer;s.connect(oc.destination);s.start(h.at,h.o,dur)});return oc.startRendering()}
async function toggleTake(){recording?await stopTake():await startTake()}
$('#rec').onclick=toggleTake;document.addEventListener('keydown',e=>{if(e.repeat)return;if((e.key==='r'||e.key==='R')&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();toggleTake()}});

function stopTakePlayback(){if(activeTakeSource){try{activeTakeSource.stop()}catch{}activeTakeSource=null}if(activeTakeId){let t=takes.find(x=>x.id===activeTakeId);if(t)t.playing=false}activeTakeId=null}
function playTake(t,whole=false){ctx();stopTakePlayback();let a,b;if(whole){a=0;b=t.buf.duration;t.sel=[0,t.buf.duration]}else [a,b]=t.sel||[0,t.buf.duration];t.playPos=a;const s=ac.createBufferSource();s.buffer=t.buf;s.connect(master);if(t.loop){s.loop=true;s.loopStart=a;s.loopEnd=b;s.start(0,a)}else{s.start(0,a,Math.max(.02,b-a))}activeTakeSource=s;activeTakeId=t.id;t.playing=true;t.playStarted=ac.currentTime;t.playBase=a;s.onended=()=>{if(activeTakeId===t.id){t.playing=false;activeTakeId=null;activeTakeSource=null}}}
function pauseTake(t){if(activeTakeId!==t.id)return;let [a,b]=t.sel||[0,t.buf.duration];let p=t.playBase+(ac.currentTime-t.playStarted);if(t.loop&&b>a)p=a+((p-a)%(b-a));t.playPos=clamp(p,a,b);stopTakePlayback();renderTakes()}
function stopTakePlaybackUI(t){stopTakePlayback();t.playPos=(t.sel||[0,t.buf.duration])[0];renderTakes()}
function deleteTake(i){stopTakePlayback();const id=takes[i]?.id;takes.splice(i,1);build=build.filter(c=>c.takeId!==id);selectedClip=null;renderTakes();renderBuild();ui()}
function updateTakeSelectionVisual(t,wrap){const [a,b]=t.sel||[0,t.buf.duration],r=wrap.getBoundingClientRect(),sel=wrap.querySelector('.sel'),h1=wrap.querySelector('.selHandle.start'),h2=wrap.querySelector('.selHandle.end');let x1=a/t.buf.duration*r.width,x2=b/t.buf.duration*r.width;sel.style.display='block';sel.style.left=x1+'px';sel.style.width=Math.max(2,x2-x1)+'px';h1.style.display=h2.style.display='block';h1.style.left=x1+'px';h2.style.left=x2+'px'}
function loopSelection(t){t.loop=true;playTake(t,false);renderTakes()}
function nudge(t,which,delta){let [a,b]=t.sel||[0,t.buf.duration];if(which==='a')a=clamp(a+delta,0,b-.01);else b=clamp(b+delta,a+.01,t.buf.duration);t.sel=[a,b];loopSelection(t)}
function renderTakes(){const host=$('#takesHost');host.innerHTML='';takes.forEach((t,i)=>{const box=document.createElement('div');box.className='takeBlock';box.innerHTML='<div class="takeHeader"><div class="takeName">'+t.name+'</div><div class="takeMeta">'+fmt(t.buf.duration)+'</div><div class="grow"></div><button class="delete ghost">削除</button></div><div class="waveWrap take"><canvas></canvas><div class="sel"></div><div class="selHandle start"></div><div class="selHandle end"></div><div class="playhead"></div></div><div class="takeTransport"><button class="tplay round">▶</button><button class="tstop round">■</button><div class="takeTime"><span class="tnow">00:00.000</span> / '+fmt(t.buf.duration)+'</div></div><div class="nudge"><div class="nudgeBox"><div class="nudgeTitle">START</div><div class="nudgeRow"><button data-nudge="a,-.05">−50ms</button><button data-nudge="a,-.01">−10</button><button data-nudge="a,.01">+10</button><button data-nudge="a,.05">+50</button></div></div><div class="nudgeBox"><div class="nudgeTitle">END</div><div class="nudgeRow"><button data-nudge="b,-.05">−50ms</button><button data-nudge="b,-.01">−10</button><button data-nudge="b,.01">+10</button><button data-nudge="b,.05">+50</button></div></div></div><div class="takeActions"><button class="loop">↻ 選択をLOOP</button><button class="toBuild">＋ BUILD</button></div>';host.appendChild(box);const wrap=box.querySelector('.waveWrap');drawWave(t.buf,wrap);updateTakeSelectionVisual(t,wrap);bindTakeSelect(t,wrap);box.querySelector('.tplay').onclick=()=>t.playing?pauseTake(t):playTake(t,false);box.querySelector('.tstop').onclick=()=>stopTakePlaybackUI(t);box.querySelector('.delete').onclick=()=>deleteTake(i);box.querySelector('.loop').onclick=()=>loopSelection(t);box.querySelector('.toBuild').onclick=()=>addTakeSelection(i);box.querySelectorAll('[data-nudge]').forEach(b=>b.onclick=()=>{let [w,d]=b.dataset.nudge.split(',');nudge(t,w,+d)})})}
function bindTakeSelect(t,wrap){let mode=null,startX=0;const startH=wrap.querySelector('.selHandle.start'),endH=wrap.querySelector('.selHandle.end');function timeFromX(x){let r=wrap.getBoundingClientRect();return clamp((x-r.left)/r.width,0,1)*t.buf.duration}const move=e=>{if(!mode)return;e.preventDefault();let v=timeFromX(e.clientX),[a,b]=t.sel;if(mode==='new'){let s=timeFromX(startX);t.sel=[Math.min(s,v),Math.max(s,v)]}else if(mode==='start')t.sel=[clamp(v,0,b-.01),b];else if(mode==='end')t.sel=[a,clamp(v,a+.01,t.buf.duration)];updateTakeSelectionVisual(t,wrap)};wrap.addEventListener('pointerdown',e=>{if(e.target===startH||e.target===endH)return;e.preventDefault();mode='new';startX=e.clientX;wrap.setPointerCapture?.(e.pointerId);move(e)},{passive:false});startH.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();mode='start';startH.setPointerCapture?.(e.pointerId)},{passive:false});endH.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();mode='end';endH.setPointerCapture?.(e.pointerId)},{passive:false});window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',()=>{if(mode){mode=null;loopSelection(t)}},{passive:false})}

function addTakeSelection(i){const t=takes[i];if(!t)return;let [a,b]=t.sel||[0,t.buf.duration],dur=Math.max(.03,b-a),end=build.reduce((m,c)=>Math.max(m,c.start+c.duration/Math.pow(2,c.pitch/12)),0);let c={id:crypto.randomUUID?.()||Math.random().toString(36),takeId:t.id,name:t.name,buf:t.buf,srcStart:a,duration:dur,start:end,lane:build.length%3,pitch:0,fx:{}};build.push(c);selectedClip=c.id;renderBuild();ui()}
function snapTime(t){let s=+$('#snap').value;if(!s)return Math.max(0,t);let beat=60/(+$('#bpm').value||120),q=beat*s;return Math.max(0,Math.round(t/q)*q)}
function renderRuler(){const r=$('#ruler');r.innerHTML='';for(let i=0;i<=9;i++){let s=document.createElement('span');s.style.left=i*PX+'px';s.textContent=i+'s';r.appendChild(s)}}
function renderBuild(){renderRuler();document.querySelectorAll('.clip').forEach(x=>x.remove());for(const c of build){const lane=document.querySelector('.lane[data-lane="'+c.lane+'"]'),el=document.createElement('div');el.className='clip'+(c.id===selectedClip?' selected':'');el.dataset.id=c.id;const rate=Math.pow(2,c.pitch/12),dispDur=c.duration/rate;el.style.left=c.start*PX+'px';el.style.width=Math.max(32,dispDur*PX)+'px';el.innerHTML='<div class="trimHandle left"></div><div class="clipInner"><canvas></canvas><div class="clipLabel">'+c.name+'</div><div class="clipPitch">'+(c.pitch>0?'+':'')+c.pitch+' st</div></div><div class="trimHandle right"></div>';lane.appendChild(el);drawClip(c,el.querySelector('canvas'));bindClip(c,el)}const s=build.find(c=>c.id===selectedClip);$('#inspector').classList.toggle('show',!!s);if(s)$('#pitchVal').textContent=(s.pitch>0?'+':'')+s.pitch+' st';$('#buildPlay').disabled=!build.length;$('#buildStop').disabled=!build.length}
function drawClip(c,cv){const r=cv.parentElement.getBoundingClientRect(),w=Math.max(1,r.width),h=Math.max(1,r.height),dpr=devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;let g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);let d=c.buf.getChannelData(0),sr=c.buf.sampleRate,st=Math.floor(c.srcStart*sr),en=Math.min(d.length,Math.floor((c.srcStart+c.duration)*sr)),step=Math.max(1,Math.floor((en-st)/w));g.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--text');g.globalAlpha=.55;g.beginPath();for(let x=0;x<w;x++){let p=st+x*step,mn=1,mx=-1;for(let j=0;j<step&&p+j<en;j++){let v=d[p+j];if(v<mn)mn=v;if(v>mx)mx=v}g.moveTo(x,(1-mx)*h/2);g.lineTo(x,(1-mn)*h/2)}g.stroke()}
function bindClip(c,el){let mode=null,ox=0,oy=0,start0=0,src0=0,dur0=0,lane0=0;const lh=el.querySelector('.trimHandle.left'),rh=el.querySelector('.trimHandle.right');const begin=(m,e)=>{e.preventDefault();e.stopPropagation();selectedClip=c.id;mode=m;ox=e.clientX;oy=e.clientY;start0=c.start;src0=c.srcStart;dur0=c.duration;lane0=c.lane;el.setPointerCapture?.(e.pointerId);renderBuild()};el.querySelector('.clipInner').addEventListener('pointerdown',e=>begin('move',e),{passive:false});lh.addEventListener('pointerdown',e=>begin('left',e),{passive:false});rh.addEventListener('pointerdown',e=>begin('right',e),{passive:false});window.addEventListener('pointermove',e=>{if(!mode)return;e.preventDefault();let dx=(e.clientX-ox)/PX;if(mode==='move'){c.start=snapTime(start0+dx);let dy=e.clientY-oy;if(Math.abs(dy)>24)c.lane=clamp(lane0+Math.round(dy/82),0,2)}else if(mode==='left'){let delta=clamp(dx,-src0,dur0-.03);c.srcStart=src0+delta;c.duration=dur0-delta;c.start=snapTime(start0+delta/Math.pow(2,c.pitch/12))}else if(mode==='right'){c.duration=clamp(dur0+dx,.03,c.buf.duration-src0)}renderBuild()},{passive:false});window.addEventListener('pointerup',()=>mode=null,{passive:false})}
function selected(){return build.find(c=>c.id===selectedClip)}
$('#pitchDown').onclick=()=>{let c=selected();if(c){c.pitch=clamp(c.pitch-1,-24,24);renderBuild()}};$('#pitchUp').onclick=()=>{let c=selected();if(c){c.pitch=clamp(c.pitch+1,-24,24);renderBuild()}};$('#duplicate').onclick=()=>{let c=selected();if(!c)return;let n={...c,id:crypto.randomUUID?.()||Math.random().toString(36),fx:{...(c.fx||{})},start:c.start+c.duration/Math.pow(2,c.pitch/12)};build.push(n);selectedClip=n.id;renderBuild()};$('#deleteClip').onclick=()=>{build=build.filter(c=>c.id!==selectedClip);selectedClip=null;renderBuild()};

function stopBuild(){for(const s of buildSources){try{s.stop()}catch{}}buildSources=[];cancelAnimationFrame(buildRAF);$('#buildHead').style.transform='translateX(0)'}
$('#buildPlay').onclick=()=>{if(!build.length)return;ctx();stopBuild();buildStartedAt=ac.currentTime+.05;for(const c of build){let s=ac.createBufferSource(),rate=Math.pow(2,c.pitch/12);s.buffer=c.buf;s.playbackRate.value=rate;s.connect(master);s.start(buildStartedAt+c.start,c.srcStart,c.duration);buildSources.push(s)}tickBuild()};$('#buildStop').onclick=stopBuild;
function tickBuild(){let t=Math.max(0,ac.currentTime-buildStartedAt);$('#buildHead').style.transform='translateX('+t*PX+'px)';buildRAF=requestAnimationFrame(tickBuild)}

$('#bpm').oninput=renderBuild;function ui(){let ok=!!buffer;['play','stop','rec'].forEach(id=>$('#'+id).disabled=!ok);$('#dur').textContent=ok?fmt(buffer.duration):'00:00.000';$('#rec').classList.toggle('danger',recording);$('#rec').classList.toggle('primary',!recording);$('#rec').innerHTML=recording?'<span class="recDot"></span>STOP':'<span class="recDot"></span>TAKE';$('#recBadge').classList.toggle('on',recording)}
(function tick(){if(buffer){let x=current()/buffer.duration*sourceWrap.clientWidth;sourceWrap.querySelector('.playhead').style.transform='translateX('+x+'px)';$('#now').textContent=fmt(current())}if(activeTakeId){let t=takes.find(x=>x.id===activeTakeId);if(t&&t.playing){let [a,b]=t.sel||[0,t.buf.duration],p=t.playBase+(ac.currentTime-t.playStarted);if(t.loop&&b>a)p=a+((p-a)%(b-a));t.playPos=p;let block=[...document.querySelectorAll('.takeBlock')][takes.indexOf(t)];if(block){let wrap=block.querySelector('.waveWrap.take');block.querySelector('.playhead').style.transform='translateX('+(p/t.buf.duration*wrap.clientWidth)+'px)';block.querySelector('.tnow').textContent=fmt(p)}}}requestAnimationFrame(tick)})();
window.addEventListener('resize',()=>{if(buffer)drawWave(buffer,sourceWrap);renderTakes();renderBuild()});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
drawWave(null,sourceWrap);renderBuild();ui();
</script>
</body></html>
