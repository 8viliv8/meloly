<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PON / CUT minimal v0.5.1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1210}iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="app" src="./minimal.html"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow,d=frame.contentDocument;
  if(!w||!d)return;
  const style=d.createElement('style');
  style.textContent=`#rec.recording{background:#c9473b!important;color:#fff!important;border-color:#c9473b!important;box-shadow:0 0 0 3px rgba(201,71,59,.16)}#rec.recording::before{content:'REC  ';font-weight:700}`;
  d.head.appendChild(style);

  // Fix: while TAKE is armed, every FIND seek must be recorded even if source is already playing.
  w.seek=function(t,audition=true){
    if(!w.buffer)return;
    w.offsetAt=w.clamp(t,0,w.buffer.duration);
    if(w.playing) w.startSource(w.offsetAt,null,w.recording);
    else if(audition) w.startSource(w.offsetAt,.055,true);
    w.updatePlayhead();
  };

  const oldUi=w.ui;
  w.ui=function(){
    oldUi();
    const rec=d.querySelector('#rec');
    if(rec){
      rec.classList.toggle('recording',!!w.recording);
      rec.textContent=w.recording?'● STOP':'● TAKE';
    }
    const takes=d.querySelector('#takes');
    if(w.recording && takes && !w.takes.length){
      takes.innerHTML='<div class="small">● REC中 — 波形をタップ / ドラッグ / SCRUBしてください</div>';
    }
  };

  async function fixedToggleRecord(){
    if(!w.buffer)return;
    w.audio();
    if(!w.recording){
      w.takeEvents=[];
      w.recording=true;
      w.recordStart=w.ac.currentTime;
      w.ui();
      return;
    }
    w.recording=false;
    w.ui();
    const tb=await w.renderTake();
    if(tb){
      w.takes.push({name:`TAKE ${w.takes.length+1}`,buf:tb});
      w.renderTakes();
    }else{
      const takes=d.querySelector('#takes');
      if(takes) takes.innerHTML='<div class="small">TAKEは空でした。REC中に波形を鳴らしてください。</div>';
    }
  }
  w.toggleRecord=fixedToggleRecord;
  const rec=d.querySelector('#rec');
  if(rec) rec.onclick=fixedToggleRecord;
  d.addEventListener('keydown',e=>{
    if(e.repeat)return;
    if((e.key==='r'||e.key==='R')&&!['INPUT','SELECT','TEXTAREA'].includes(d.activeElement?.tagName)){
      e.preventDefault();e.stopImmediatePropagation();fixedToggleRecord();
    }
  },true);
  w.ui();
});
</script>
</body>
</html>
