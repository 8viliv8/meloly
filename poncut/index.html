<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PON / CUT</title>
<style>
:root{--bg:#0b0c0f;--p:#14161b;--p2:#1b1e25;--l:#2d3139;--t:#f4f6fb;--m:#9ca4b3;--a:#e5edff;--g:#dfffe8;--y:#ffe8bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:1100px;margin:auto;padding:14px 12px 100px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.small{font-size:11px;color:var(--m)}button,.file,input,select{font:inherit}.file,button,select{background:var(--p2);border:1px solid var(--l);color:var(--t);border-radius:10px;padding:9px 11px;cursor:pointer}button:disabled{opacity:.4}input[type=file]{display:none}.card{background:var(--p);border:1px solid var(--l);border-radius:15px;padding:12px;margin:10px 0}.wave{height:300px;position:relative;background:#0f1116;border:1px solid #252a33;border-radius:14px;overflow:hidden;touch-action:none}.wave canvas{width:100%;height:100%;display:block}.ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none}.lab{position:absolute;left:10px;top:8px;background:#0009;padding:5px 7px;border-radius:7px;font-size:11px}.modes{display:flex;gap:6px;overflow:auto;margin:10px 0}.mode.active{background:var(--a);color:#111;font-weight:700}.take{background:var(--g)!important;color:#111!important}.slice{background:var(--y)!important;color:#111!important}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.field{background:#101217;border:1px solid var(--l);border-radius:10px;padding:8px}.field label{display:block;font-size:11px;color:var(--m);margin-bottom:5px}.field input,.field select{width:100%}.takewaves{display:flex;flex-direction:column;gap:8px;margin-top:10px}.takewave{height:130px;position:relative;background:#0f1511;border:1px solid #2b3b31;border-radius:12px;overflow:hidden}.takewave canvas{width:100%;height:100%}.tag{position:absolute;left:8px;top:7px;font-size:10px;background:#0d120fcc;color:#cfe9d5;padding:4px 6px;border-radius:6px}.timeline{min-height:110px;background:#101217;border:1px dashed #39404d;border-radius:12px;padding:8px;display:flex;gap:8px;overflow:auto}.slot{min-width:170px;background:#181b21;border:1px solid var(--l);border-radius:10px;padding:8px}.foot{position:fixed;left:0;right:0;bottom:0;background:#090a0dee;border-top:1px solid var(--l);padding:9px 12px calc(9px + env(safe-area-inset-bottom))}.foot>div{max-width:1100px;margin:auto;display:flex;gap:7px}.foot button{flex:1}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.wave{height:340px}}
</style>
</head>
<body>
<div class="app">
<div class="row"><div><h1 style="margin:0;font-size:25px">PON / CUT</h1><div class="small">探す → 手で鳴らす → TAKE → BUILD</div></div><div class="grow"></div><div class="small">HTTPS test v0.4</div></div>
<div class="modes"><button class="mode active" data-m="find">FIND</button><button class="mode" data-m="scrub">SCRUB</button><button class="mode" data-m="slice">SLICE</button><button class="mode" data-m="take">TAKE</button><button class="mode" data-m="build">BUILD</button></div>
<div class="card">
<div class="row"><label class="file"><input id="file" type="file">音源ファイルを選ぶ</label><button id="demo">内蔵テスト音源</button><span id="status" class="small">音源未読込</span><div class="grow"></div><button id="play" disabled>▶</button><button id="stop" disabled>■</button><span class="small"><span id="now">00:00.000</span> / <span id="dur">00:00.000</span></span></div>
<div id="wave" class="wave"><canvas id="cv"></canvas><div id="ph" class="ph"></div><div id="lab" class="lab">FIND — タップで再生</div></div>
<div class="grid"><div class="field"><label>ZOOM</label><input id="zoom" type="range" min="1" max="20" step=".1" value="1"></div><div class="field"><label>VIEW</label><input id="view" type="range" min="0" max="1000" value="0"></div><div class="field"><label>BUILD beat</label><select id="beats"><option value=".25">1/4</option><option value=".5">1/2</option><option value="1" selected>1</option><option value="2">2</option><option value="4">4</option></select></div><div class="field"><label>BUILD BPM</label><input id="buildBpm" type="number" min="30" max="300" value="120"></div></div>
<div class="row" style="margin-top:8px"><button id="in" disabled>IN</button><button id="out" disabled>OUT</button><button id="slice" class="slice" disabled>自動SLICE</button><button id="add" disabled>＋ BUILD</button><span id="sel" class="small">IN -- / OUT --</span></div>
<div id="takewaves" class="takewaves"></div>
</div>
<div class="card"><div class="row"><b>TAKE</b><div class="grow"></div><button id="rec" class="take" disabled>● TAKE REC</button><button id="pt" disabled>▶ TAKE</button></div><div id="tinfo" class="small" style="margin-top:8px">Rで録音開始 / もう一度Rで停止。停止と同時にTAKE波形を生成します。</div></div>
<div class="card"><div class="row"><b>BUILD</b><div class="grow"></div><button id="pb" disabled>▶ BUILD</button><button id="clear" disabled>クリア</button></div><div id="tl" class="timeline"><div class="small">TAKE波形をここへD&D</div></div></div>
</div>
<div class="foot"><div><button id="frec" class="take" disabled>● TAKE REC</button><button id="fadd" disabled>＋ BUILD</button><button id="fslice" class="slice" disabled>自動SLICE</button></div></div>
<script>
let ac,source=null,node=null,playing=false,ps=0,po=0,zoom=1,view=0,mode='find',IN=null,OUT=null,slices=[],rec=false,rec0=0,take=[],takeWaves=[],build=[],dragY=null;
const $=q=>document.querySelector(q),W=$('#wave'),C=$('#cv'),PH=$('#ph');
function audio(){if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)throw Error('Web Audio API unavailable');ac=new A()}if(ac.state==='suspended')ac.resume()}
function fmt(t){let m=Math.floor(t/60),s=Math.floor(t%60),ms=Math.floor((t%1)*1000);return`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(3,'0')}`}
function ct(){if(!source)return 0;return playing?Math.min(source.duration,po+(ac.currentTime-ps)):po}
function stop(){if(node){try{node.stop()}catch{}node=null}playing=false}
function playFrom(t,d=null,log=true){if(!source)return;audio();stop();po=Math.max(0,Math.min(t,source.duration-.001));node=ac.createBufferSource();node.buffer=source;node.connect(ac.destination);ps=ac.currentTime;d?node.start(0,po,Math.min(d,source.duration-po)):node.start(0,po);playing=true;node.onended=()=>playing=false;if(rec&&log)take.push({at:ac.currentTime-rec0,o:po,d:d||.35})}
function vr(){if(!source)return[0,1];let span=source.duration/zoom,st=view*Math.max(0,source.duration-span);return[st,Math.min(source.duration,st+span)]}
function x2t(x){let r=W.getBoundingClientRect(),[a,z]=vr();return a+(Math.max(0,Math.min(r.width,x-r.left))/r.width)*(z-a)}
function t2x(t,w){let[a,z]=vr();return((t-a)/(z-a))*w}
function draw(){let r=W.getBoundingClientRect(),w=Math.max(1,r.width),h=Math.max(1,r.height),dpr=devicePixelRatio||1;C.width=w*dpr;C.height=h*dpr;let g=C.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle='#0f1116';g.fillRect(0,0,w,h);g.strokeStyle='#39404b';g.beginPath();g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();if(!source)return;let[a,z]=vr(),d=source.getChannelData(0),sf=Math.floor(a*source.sampleRate),ef=Math.min(d.length,Math.ceil(z*source.sampleRate)),step=Math.max(1,Math.floor((ef-sf)/w));g.strokeStyle='#e1e7f2';g.beginPath();for(let x=0;x<w;x++){let p=sf+x*step,mn=1,mx=-1;for(let j=0;j<step&&p+j<ef;j++){let v=d[p+j];if(v<mn)mn=v;if(v>mx)mx=v}g.moveTo(x,(1-mx)*h/2);g.lineTo(x,(1-mn)*h/2)}g.stroke();if(IN!=null&&OUT!=null){let x1=t2x(IN,w),x2=t2x(OUT,w);g.fillStyle='#d9d2ff22';g.fillRect(x1,0,x2-x1,h)}g.strokeStyle='#f0c56f';for(let t of slices){if(t<a||t>z)continue;let x=t2x(t,w);g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}}
function ui(){let ok=!!source;for(let id of['play','stop','in','out','slice','add','rec','frec','fadd','fslice'])$('#'+id).disabled=!ok;$('#pt').disabled=!take.length;$('#pb').disabled=!build.length;$('#clear').disabled=!build.length;$('#dur').textContent=ok?fmt(source.duration):'00:00.000';$('#rec').textContent=$('#frec').textContent=rec?'■ STOP TAKE':'● TAKE REC'}
async function loadFile(f){try{$('#status').textContent='読み込み中…';audio();let ab=await f.arrayBuffer(),b=await ac.decodeAudioData(ab.slice(0));source=b;po=0;IN=OUT=null;slices=[];take=[];takeWaves=[];build=[];draw();renderTakes();renderBuild();ui();$('#status').textContent='読込完了：'+f.name}catch(e){console.error(e);$('#status').textContent='読込失敗：'+e.message}}
$('#file').onchange=e=>e.target.files[0]&&loadFile(e.target.files[0]);
$('#demo').onclick=()=>{audio();let sr=44100,b=ac.createBuffer(1,sr*6,sr),d=b.getChannelData(0);for(let i=0;i<d.length;i++){let t=i/sr,k=t%.5,s=t%.25,v=0;if(k<.12)v+=Math.sin(2*Math.PI*75*t)*Math.exp(-k*30)*.7;if(s<.03)v+=(Math.random()*2-1)*Math.exp(-s*80)*.25;d[i]=v}source=b;po=0;draw();ui();$('#status').textContent='内蔵音源OK'};
$('#play').onclick=()=>playing?(po=ct(),stop()):playFrom(po,null,false);$('#stop').onclick=()=>{stop();po=0};
$('#zoom').oninput=e=>{zoom=+e.target.value;draw()};$('#view').oninput=e=>{view=+e.target.value/1000;draw()};
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));$('#lab').textContent={find:'FIND — タップで再生',scrub:'SCRUB — 左右ドラッグ',slice:'SLICE — 区間をタップ',take:'TAKE',build:'BUILD'}[mode]});
function seg(t){let a=[0,...slices,source.duration].sort((x,y)=>x-y);for(let i=0;i<a.length-1;i++)if(t>=a[i]&&t<a[i+1])return[a[i],a[i+1]]}
function detect(){if(!source)return;let d=source.getChannelData(0),sr=source.sampleRate,hop=Math.floor(sr*.01),vals=[];for(let i=0;i<d.length-hop;i+=hop){let s=0;for(let j=0;j<hop;j++)s+=Math.abs(d[i+j]);vals.push(s/hop)}let diff=[];for(let i=1;i<vals.length;i++)diff.push(Math.max(0,vals[i]-vals[i-1]));let sorted=[...diff].sort((a,b)=>a-b),th=sorted[Math.floor(sorted.length*.92)]||0,last=-99;slices=[];for(let i=1;i<diff.length-1;i++)if(diff[i]>th&&i-last>8){slices.push(i*hop/sr);last=i}draw()}
$('#slice').onclick=detect;$('#fslice').onclick=detect;
W.onpointerdown=e=>{if(!source)return;W.setPointerCapture(e.pointerId);dragY={y:e.clientY,z:zoom,x:e.clientX};let t=x2t(e.clientX);if(mode==='slice'&&slices.length){let q=seg(t);IN=q[0];OUT=q[1];playFrom(IN,OUT-IN,true)}else playFrom(t,null,true);sel()};
W.onpointermove=e=>{if(!source||e.buttons===0)return;if(mode==='scrub'){playFrom(x2t(e.clientX),.06,true);return}if(dragY){let dy=dragY.y-e.clientY;if(Math.abs(dy)>4){zoom=Math.max(1,Math.min(20,dragY.z*Math.exp(dy/120)));$('#zoom').value=zoom;draw()}}};W.onpointerup=()=>dragY=null;
function sel(){$('#sel').textContent='IN '+(IN==null?'--':fmt(IN))+' / OUT '+(OUT==null?'--':fmt(OUT));draw()}
$('#in').onclick=()=>{IN=ct();if(OUT!=null&&OUT<IN)[IN,OUT]=[OUT,IN];sel()};$('#out').onclick=()=>{OUT=ct();if(IN!=null&&OUT<IN)[IN,OUT]=[OUT,IN];sel()};
async function renderTakeBuffer(){if(!take.length)return null;audio();let sr=source.sampleRate,total=take[take.length-1].at+1,oc=new OfflineAudioContext(1,Math.ceil(total*sr),sr);take.forEach((h,i)=>{let nx=take[i+1],d=Math.max(.03,Math.min(h.d,nx?nx.at-h.at:.35,source.duration-h.o)),s=oc.createBufferSource();s.buffer=source;s.connect(oc.destination);s.start(h.at,h.o,d)});return await oc.startRendering()}
function drawTake(buf,cv){let r=cv.parentElement.getBoundingClientRect(),w=r.width,h=r.height,dpr=devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;let g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle='#0f1511';g.fillRect(0,0,w,h);let d=buf.getChannelData(0),step=Math.max(1,Math.floor(d.length/w));g.strokeStyle='#c9f5d3';g.beginPath();for(let x=0;x<w;x++){let p=x*step,mn=1,mx=-1;for(let j=0;j<step&&p+j<d.length;j++){let v=d[p+j];if(v<mn)mn=v;if(v>mx)mx=v}g.moveTo(x,(1-mx)*h/2);g.lineTo(x,(1-mn)*h/2)}g.stroke()}
function renderTakes(){let h=$('#takewaves');h.innerHTML='';takeWaves.forEach((t,i)=>{let d=document.createElement('div');d.className='takewave';d.draggable=true;d.innerHTML='<canvas></canvas><div class="tag">TAKE '+String(i+1).padStart(2,'0')+' ⇢ BUILDへD&D</div>';d.ondragstart=e=>e.dataTransfer.setData('text/take',String(i));h.appendChild(d);drawTake(t,d.querySelector('canvas'))})}
async function toggleRec(){if(!source)return;audio();if(!rec){take=[];rec=true;rec0=ac.currentTime;ui();return}rec=false;ui();let b=await renderTakeBuffer();if(b){takeWaves.push(b);renderTakes()}}
$('#rec').onclick=toggleRec;$('#frec').onclick=toggleRec;document.addEventListener('keydown',e=>{if(!e.repeat&&(e.key==='r'||e.key==='R')&&!['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();toggleRec()}});$('#pt').onclick=()=>{if(!takeWaves.length)return;audio();let s=ac.createBufferSource();s.buffer=takeWaves[takeWaves.length-1];s.connect(ac.destination);s.start()};
function addSel(){if(IN==null||OUT==null||OUT<=IN)return;build.push({buf:source,a:IN,d:OUT-IN,beats:+$('#beats').value||1,name:'CLIP '+(build.length+1)});renderBuild();ui()}$('#add').onclick=addSel;$('#fadd').onclick=addSel;
function target(p){return 60/(+$('#buildBpm').value||120)*(p.beats||1)}
function renderBuild(){let h=$('#tl');h.innerHTML='';if(!build.length){h.innerHTML='<div class="small">TAKE波形をここへD&D</div>';return}build.forEach((p,i)=>{let d=document.createElement('div');d.className='slot';d.innerHTML='<b>'+p.name+'</b><div class="small">'+p.d.toFixed(2)+'s → '+target(p).toFixed(2)+'s</div>';h.appendChild(d)})}
$('#tl').ondragover=e=>{e.preventDefault()};$('#tl').ondrop=e=>{e.preventDefault();let i=+e.dataTransfer.getData('text/take'),b=takeWaves[i];if(!b)return;build.push({buf:b,a:0,d:b.duration,beats:+$('#beats').value||1,name:'TAKE '+(i+1)});renderBuild();ui()};
$('#pb').onclick=()=>{audio();let t=ac.currentTime+.05;build.forEach(p=>{let s=ac.createBufferSource(),tg=target(p);s.buffer=p.buf;s.playbackRate.value=p.d/tg;s.connect(ac.destination);s.start(t,p.a,p.d);t+=tg})};$('#clear').onclick=()=>{build=[];renderBuild();ui()};$('#buildBpm').oninput=renderBuild;
(function loop(){if(source){$('#now').textContent=fmt(ct());PH.style.transform='translateX('+t2x(ct(),W.getBoundingClientRect().width)+'px)'}requestAnimationFrame(loop)})();window.addEventListener('resize',()=>{draw();renderTakes()});ui();draw();
</script>
</body>
</html>
