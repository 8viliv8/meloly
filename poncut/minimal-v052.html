<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PON / CUT minimal v0.5.2</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1210}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="app" src="./minimal.html"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d)return;
  const style=d.createElement('style');
  style.textContent=`#rec.rec-on{background:#c9473b!important;color:#fff!important;border-color:#c9473b!important;box-shadow:0 0 0 3px rgba(201,71,59,.17)}#rec.rec-on::before{content:'REC  ';font-weight:700}`;
  d.head.appendChild(style);
  const rec=d.querySelector('#rec');
  const stop=d.querySelector('#stop');
  const takes=d.querySelector('#takes');
  if(!rec)return;

  const paint=()=>{
    const active=/STOP/.test(rec.textContent||'');
    rec.classList.toggle('rec-on',active);
    if(active && takes && !takes.querySelector('.takewave')){
      takes.innerHTML='<div class="small">● REC中 — 波形をタップ / ドラッグ / SCRUBしてください</div>';
    }
  };

  // Starting TAKE while the main source is still playing caused FIND seek events
  // to bypass TAKE logging. Always stop transport before arming TAKE.
  rec.addEventListener('pointerdown',()=>{
    if(!/STOP/.test(rec.textContent||'')) stop?.click();
  },true);
  rec.addEventListener('click',()=>setTimeout(paint,0));

  // Use R as the same safe TAKE toggle on desktop keyboards.
  d.addEventListener('keydown',e=>{
    if(e.repeat)return;
    if((e.key==='r'||e.key==='R')&&!['INPUT','SELECT','TEXTAREA'].includes(d.activeElement?.tagName)){
      e.preventDefault();e.stopImmediatePropagation();
      if(!/STOP/.test(rec.textContent||'')) stop?.click();
      rec.click();
      setTimeout(paint,0);
    }
  },true);
});
</script>
</body>
</html>
