<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PON / CUT — Studio</title>
<style>
:root{
  --bg:#f5f5f7;--surface:#fff;--surface2:#f0f0f3;--text:#111114;--muted:#74747c;
  --line:#d9d9df;--accent:#0a84ff;--rec:#ff453a;--take:#ecf7ff;--clip:#dff1ff;
  --shadow:0 8px 28px rgba(0,0,0,.07);--r:18px;
}
@media(prefers-color-scheme:dark){
:root{--bg:#000;--surface:#1c1c1e;--surface2:#2c2c2e;--text:#f5f5f7;--muted:#98989f;--line:#3a3a3c;--accent:#0a84ff;--rec:#ff453a;--take:#112333;--clip:#10314f;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;overflow-x:hidden}
button,input,select{font:inherit} button{min-height:44px}
input,select{-webkit-user-select:auto;user-select:auto}
.app{max-width:760px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 16px}
.brand{font-weight:700;letter-spacing:.09em;font-size:15px}.ver{font-size:11px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.grow{flex:1}.small{font-size:11px;color:var(--muted)}
button,.file,.pill,select,input[type=number]{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:999px;padding:9px 13px}
button:disabled{opacity:.35}.file input{display:none}.primary{background:var(--accent);border-color:var(--accent);color:white}
.danger{background:var(--rec);border-color:var(--rec);color:white}.ghost{background:transparent}
.waveWrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);touch-action:none}
.waveWrap.main{height:170px;margin-top:12px}.waveWrap.take{height:96px;background:var(--take);margin-top:9px}
canvas{display:block;width:100%;height:100%}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none;will-change:transform}
.sel{position:absolute;top:0;bottom:0;background:rgba(10,132,255,.15);border-left:2px solid var(--accent);border-right:2px solid var(--accent);display:none;pointer-events:none}
.hint{position:absolute;left:9px;top:8px;font-size:10px;color:var(--muted);background:color-mix(in srgb,var(--surface) 84%, transparent);border-radius:999px;padding:4px 7px;pointer-events:none}
.transport{display:flex;align-items:center;gap:10px;margin-top:10px}.round{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center}
.time{margin-left:auto;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.takeHeader{display:flex;align-items:center;gap:8px;margin-top:4px}.takeName{font-weight:600;font-size:13px}.takeMeta{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.takeActions{display:flex;gap:7px;margin-top:8px}.takeActions button{flex:1}
.sectionTitle{font-size:12px;font-weight:700;letter-spacing:.06em;margin-bottom:9px}
.segmented{display:flex;background:var(--surface2);border-radius:999px;padding:3px}.segmented button{flex:1;border:0;background:transparent;min-height:36px;padding:6px 10px}.segmented button.active{background:var(--surface);box-shadow:0 1px 5px rgba(0,0,0,.12)}
.buildTools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tool{background:var(--surface2);border-radius:14px;padding:10px}.tool label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.tool input,.tool select{width:100%}
.timelineViewport{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface2);touch-action:pan-x}
.timeline{position:relative;min-width:900px;height:258px;background:
 linear-gradient(to right, color-mix(in srgb,var(--line) 68%, transparent) 1px, transparent 1px),
 linear-gradient(to right, color-mix(in srgb,var(--line) 34%, transparent) 1px, transparent 1px);
 background-size:120px 100%,30px 100%}
.ruler{position:absolute;left:0;right:0;top:0;height:28px;border-bottom:1px solid var(--line);font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.ruler span{position:absolute;top:7px;transform:translateX(4px)}
.lane{position:absolute;left:0;right:0;height:72px;border-bottom:1px solid var(--line)}
.lane1{top:28px}.lane2{top:100px}.lane3{top:172px}
.clip{position:absolute;height:54px;top:9px;border-radius:10px;background:var(--clip);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));overflow:hidden;touch-action:none;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.clip.selected{outline:2px solid var(--accent);outline-offset:1px}
.clip canvas{opacity:.78}.clipLabel{position:absolute;left:7px;top:5px;font-size:10px;font-weight:600;pointer-events:none}.clipPitch{position:absolute;right:7px;bottom:5px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);pointer-events:none}
.buildHead{position:absolute;top:0;bottom:0;width:2px;background:var(--rec);z-index:4;pointer-events:none}
.inspector{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.inspector.show{display:block}
.inspectorRow{display:flex;gap:8px;align-items:center}.pitchVal{min-width:72px;text-align:center;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}.inspectorRow button{flex:1}
.bottom{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom));z-index:20}
.bottomIn{max-width:760px;margin:auto;display:flex;gap:8px}.bottomIn button{flex:1;font-weight:650}
.recDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:6px}
.recBadge{display:none;color:var(--rec);font-size:11px;font-weight:700;margin-left:6px}.recBadge.on{display:inline}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">PON / CUT</div><div class="ver">studio v0.6</div></div>

  <div class="card">
    <div class="row">
      <label class="file"><input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.aif,.aiff,.flac">音源</label>
      <button id="demo">DEMO</button>
      <span id="status" class="small">音源未読込</span><span id="recBadge" class="recBadge">● REC</span>
    </div>
    <div id="sourceWave" class="waveWrap main"><canvas></canvas><div class="playhead"></div><div class="hint">tap / drag</div></div>
    <div class="transport"><button id="play" class="round" disabled>▶</button><button id="stop" class="round" disabled>■</button><div class="time"><span id="now">00:00.000</span> / <span id="dur">00:00.000</span></div></div>

    <div id="takesHost"></div>
  </div>

  <div class="card">
    <div class="row"><div class="sectionTitle" style="margin:0">BUILD</div><div class="grow"></div><button id="buildPlay" disabled>▶</button><button id="buildStop" disabled>■</button></div>
    <div class="buildTools">
      <div class="tool"><label>GRID BPM（音は変えない）</label><input id="bpm" type="number" min="30" max="300" value="120"></div>
      <div class="tool"><label>SNAP</label><select id="snap"><option value="0">OFF</option><option value=".25">1/16</option><option value=".5">1/8</option><option value="1" selected>1/4</option></select></div>
    </div>
    <div class="timelineViewport">
      <div id="timeline" class="timeline">
        <div id="ruler" class="ruler"></div>
        <div class="lane lane1" data-lane="0"></div>
        <div class="lane lane2" data-lane="1"></div>
        <div class="lane lane3" data-lane="2"></div>
        <div id="buildHead" class="buildHead"></div>
      </div>
    </div>
    <div id="inspector" class="inspector">
      <div class="small" style="margin-bottom:7px">CLIP</div>
      <div class="inspectorRow">
        <button id="pitchDown">−1</button><div id="pitchVal" class="pitchVal">0 st</div><button id="pitchUp">+1</button>
      </div>
      <div class="inspectorRow" style="margin-top:8px"><button id="duplicate">複製</button><button id="deleteClip">削除</button></div>
      <div class="small" style="margin-top:8px">PITCHは現在VARISPEED方式。BUILDのBPMはクリップ速度に影響しません。</div>
    </div>
  </div>
</div>

<div class="bottom"><div class="bottomIn"><button id="rec" class="primary" disabled><span class="recDot"></span>TAKE</button></div></div>

<script>
'use strict';
const $=q=>document.querySelector(q), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let ac=null, master=null, captureDest=null, buffer=null, node=null, playing=false, startedAt=0, offsetAt=0;
let mediaRec=null, recChunks=[], recording=false, recStart=0, performanceEvents=[], takes=[];
let build=[], selectedClip=null, buildSources=[], buildStartedAt=0, buildRAF=0;
const PX=120;

function ctx(){
  if(!ac){
    const A=window.AudioContext||window.webkitAudioContext;
    if(!A) throw Error('Web Audio API unavailable');
    ac=new A();
    master=ac.createGain(); master.connect(ac.destination);
    captureDest=ac.createMediaStreamDestination(); master.connect(captureDest);
  }
  if(ac.state==='suspended') ac.resume();
}
function fmt(t){t=Math.max(0,t||0);let m=Math.floor(t/60),s=Math.floor(t%60),ms=Math.floor((t%1)*1000);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(ms).padStart(3,'0')}
function current(){if(!buffer)return 0;return playing?Math.min(buffer.duration,offsetAt+(ac.currentTime-startedAt)):offsetAt}
function stopSource(){if(node){try{node.onended=null;node.stop()}catch{}node=null}playing=false}
function playFrom(t,dur=null,log=true){
  if(!buffer)return;ctx();stopSource();offsetAt=clamp(t,0,Math.max(0,buffer.duration-.001));
  node=ac.createBufferSource();node.buffer=buffer;node.connect(master);startedAt=ac.currentTime;
  if(dur==null)node.start(0,offsetAt);else node.start(0,offsetAt,Math.min(dur,buffer.duration-offsetAt));
  playing=true;node.onended=()=>playing=false;
  if(recording&&log)performanceEvents.push({at:ac.currentTime-recStart,o:offsetAt,d:dur||.18});
}
function seek(t){ if(!buffer)return; const was=playing; offsetAt=clamp(t,0,buffer.duration); if(was)playFrom(offsetAt,null,true); else playFrom(offsetAt,.07,true); }

function drawWave(buf,wrap){
  const cv=wrap.querySelector('canvas'),r=wrap.getBoundingClientRect(),w=Math.max(1,r.width),h=Math.max(1,r.height),dpr=devicePixelRatio||1;
  cv.width=Math.floor(w*dpr);cv.height=Math.floor(h*dpr);const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  if(!buf)return;const d=buf.getChannelData(0),step=Math.max(1,Math.floor(d.length/w));g.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--text');g.globalAlpha=.88;g.beginPath();
  for(let x=0;x<w;x++){let p=x*step,mn=1,mx=-1;for(let j=0;j<step&&p+j<d.length;j++){let v=d[p+j];if(v<mn)mn=v;if(v>mx)mx=v}g.moveTo(x,(1-mx)*h/2);g.lineTo(x,(1-mn)*h/2)}g.stroke();g.globalAlpha=1;
}
const sourceWrap=$('#sourceWave');
function bindSourceGesture(){
  let active=false;
  const move=e=>{if(!active||!buffer)return;e.preventDefault();const r=sourceWrap.getBoundingClientRect(),t=clamp((e.clientX-r.left)/r.width,0,1)*buffer.duration;seek(t)};
  sourceWrap.addEventListener('pointerdown',e=>{if(!buffer)return;e.preventDefault();active=true;sourceWrap.setPointerCapture?.(e.pointerId);move(e)},{passive:false});
  window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',()=>active=false,{passive:false});window.addEventListener('pointercancel',()=>active=false,{passive:false});
}
bindSourceGesture();

async function decodeFile(f){
  $('#status').textContent='読み込み中…';ctx();const ab=await f.arrayBuffer();let b;
  try{b=await ac.decodeAudioData(ab.slice(0))}catch(e){b=await new Promise((res,rej)=>ac.decodeAudioData(ab.slice(0),res,rej))}
  buffer=b;offsetAt=0;takes=[];build=[];selectedClip=null;$('#status').textContent=f.name;drawWave(buffer,sourceWrap);renderTakes();renderBuild();ui();
}
$('#file').onchange=e=>{let f=e.target.files?.[0];if(f)decodeFile(f).catch(err=>$('#status').textContent='ERROR '+err.message)};
$('#demo').onclick=()=>{ctx();let sr=44100,b=ac.createBuffer(1,sr*8,sr),d=b.getChannelData(0);for(let i=0;i<d.length;i++){let t=i/sr,k=t%.5,v=0;if(k<.12)v+=Math.sin(2*Math.PI*(70+30*Math.exp(-k*12))*t)*Math.exp(-k*28)*.75;if(t%.25<.025)v+=(Math.random()*2-1)*.18*Math.exp(-(t%.25)*90);d[i]=v}buffer=b;offsetAt=0;takes=[];build=[];$('#status').textContent='DEMO';drawWave(buffer,sourceWrap);renderTakes();renderBuild();ui()};

$('#play').onclick=()=>{if(!buffer)return;if(playing){offsetAt=current();stopSource();}else playFrom(offsetAt,null,false)};
$('#stop').onclick=()=>{stopSource();offsetAt=0};

function bestMime(){
  if(!window.MediaRecorder)return '';
  const opts=['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm'];
  return opts.find(x=>MediaRecorder.isTypeSupported?.(x))||'';
}
async function startTake(){
  if(!buffer)return;ctx();recording=true;performanceEvents=[];recStart=ac.currentTime;recChunks=[];
  const mime=bestMime();
  if(window.MediaRecorder&&captureDest){
    try{
      mediaRec=new MediaRecorder(captureDest.stream,mime?{mimeType:mime}:undefined);
      mediaRec.ondataavailable=e=>{if(e.data?.size)recChunks.push(e.data)};
      mediaRec.start(50);
    }catch(e){mediaRec=null}
  }
  ui();
}
async function stopTake(){
  if(!recording)return;recording=false;ui();
  let raw=null;
  if(mediaRec&&mediaRec.state!=='inactive'){
    const mr=mediaRec;raw=await new Promise(resolve=>{
      mr.onstop=async()=>{
        try{
          const blob=new Blob(recChunks,{type:mr.mimeType||'audio/webm'}),ab=await blob.arrayBuffer();
          const b=await ac.decodeAudioData(ab.slice(0));resolve(b);
        }catch(e){resolve(null)}
      };mr.stop();
    });
  }
  if(!raw)raw=await renderFromEvents();
  if(raw){takes.push({name:'TAKE '+(takes.length+1),buf:raw,events:performanceEvents.map(x=>({...x})),sel:[0,raw.duration]});renderTakes();ui()}
}
async function renderFromEvents(){
  if(!performanceEvents.length)return null;const sr=buffer.sampleRate,total=Math.max(.2,performanceEvents.at(-1).at+.35),oc=new OfflineAudioContext(1,Math.ceil(total*sr),sr);
  performanceEvents.forEach((h,i)=>{let nx=performanceEvents[i+1],dur=Math.max(.025,Math.min(h.d||.18,nx?nx.at-h.at:.18,buffer.duration-h.o));let s=oc.createBufferSource();s.buffer=buffer;s.connect(oc.destination);s.start(h.at,h.o,dur)});return oc.startRendering();
}
async function toggleTake(){recording?await stopTake():await startTake()}
$('#rec').onclick=toggleTake;
document.addEventListener('keydown',e=>{if(e.repeat)return;if((e.key==='r'||e.key==='R')&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();toggleTake()}});

function renderTakes(){
  const host=$('#takesHost');host.innerHTML='';
  takes.forEach((t,i)=>{
    const box=document.createElement('div');box.innerHTML=
      '<div class="takeHeader"><div class="takeName">'+t.name+'</div><div class="takeMeta">'+fmt(t.buf.duration)+'</div><div class="grow"></div><div class="small">drag to select</div></div>'+
      '<div class="waveWrap take"><canvas></canvas><div class="sel"></div></div>'+
      '<div class="takeActions"><button class="listen">▶ 選択</button><button class="toBuild">＋ BUILD</button></div>';
    host.appendChild(box);const wrap=box.querySelector('.waveWrap');drawWave(t.buf,wrap);bindTakeSelect(t,wrap);box.querySelector('.listen').onclick=()=>previewTake(t);box.querySelector('.toBuild').onclick=()=>addTakeSelection(i);
  });
}
function bindTakeSelect(t,wrap){
  let down=false,start=0;const sel=wrap.querySelector('.sel');
  const upd=e=>{if(!down)return;e.preventDefault();let r=wrap.getBoundingClientRect(),x=clamp(e.clientX-r.left,0,r.width),a=clamp(start,0,r.width),l=Math.min(a,x),rr=Math.max(a,x);sel.style.display='block';sel.style.left=l+'px';sel.style.width=(rr-l)+'px';t.sel=[l/r.width*t.buf.duration,rr/r.width*t.buf.duration]};
  wrap.addEventListener('pointerdown',e=>{e.preventDefault();down=true;let r=wrap.getBoundingClientRect();start=clamp(e.clientX-r.left,0,r.width);wrap.setPointerCapture?.(e.pointerId);upd(e)},{passive:false});
  window.addEventListener('pointermove',upd,{passive:false});window.addEventListener('pointerup',()=>down=false,{passive:false});
  t.sel=t.sel||[0,t.buf.duration];
}
function previewTake(t){ctx();let [a,b]=t.sel||[0,t.buf.duration],s=ac.createBufferSource();s.buffer=t.buf;s.connect(master);s.start(0,a,Math.max(.02,b-a))}
function addTakeSelection(i){
  const t=takes[i];if(!t)return;let [a,b]=t.sel||[0,t.buf.duration],dur=Math.max(.03,b-a);
  const end=build.reduce((m,c)=>Math.max(m,c.start+c.duration/Math.pow(2,c.pitch/12)),0);
  build.push({id:crypto.randomUUID?.()||Math.random().toString(36),name:t.name,buf:t.buf,srcStart:a,duration:dur,start:end,lane:build.length%3,pitch:0});
  selectedClip=build.at(-1).id;renderBuild();ui();
}
function snapTime(t){let s=+$('#snap').value;if(!s)return Math.max(0,t);let beat=60/(+$('#bpm').value||120),q=beat*s;return Math.max(0,Math.round(t/q)*q)}
function renderRuler(){
  const r=$('#ruler');r.innerHTML='';for(let i=0;i<=8;i++){let s=document.createElement('span');s.style.left=(i*PX)+'px';s.textContent=i+'s';r.appendChild(s)}
}
function renderBuild(){
  renderRuler();document.querySelectorAll('.clip').forEach(x=>x.remove());
  for(const c of build){
    const lane=document.querySelector('.lane[data-lane="'+c.lane+'"]'),el=document.createElement('div');el.className='clip'+(c.id===selectedClip?' selected':'');el.dataset.id=c.id;
    const rate=Math.pow(2,c.pitch/12),dispDur=c.duration/rate;el.style.left=(c.start*PX)+'px';el.style.width=Math.max(26,dispDur*PX)+'px';
    el.innerHTML='<canvas></canvas><div class="clipLabel">'+c.name+'</div><div class="clipPitch">'+(c.pitch>0?'+':'')+c.pitch+' st</div>';lane.appendChild(el);drawClip(c,el.querySelector('canvas'));bindClip(c,el);
  }
  const sel=build.find(c=>c.id===selectedClip);$('#inspector').classList.toggle('show',!!sel);if(sel)$('#pitchVal').textContent=(sel.pitch>0?'+':'')+sel.pitch+' st';
  $('#buildPlay').disabled=!build.length;$('#buildStop').disabled=!build.length;
}
function drawClip(c,cv){const r=cv.parentElement.getBoundingClientRect(),w=Math.max(1,r.width),h=Math.max(1,r.height),dpr=devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;let g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);let d=c.buf.getChannelData(0),sr=c.buf.sampleRate,st=Math.floor(c.srcStart*sr),en=Math.min(d.length,Math.floor((c.srcStart+c.duration)*sr)),step=Math.max(1,Math.floor((en-st)/w));g.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--text');g.globalAlpha=.55;g.beginPath();for(let x=0;x<w;x++){let p=st+x*step,mn=1,mx=-1;for(let j=0;j<step&&p+j<en;j++){let v=d[p+j];if(v<mn)mn=v;if(v>mx)mx=v}g.moveTo(x,(1-mx)*h/2);g.lineTo(x,(1-mn)*h/2)}g.stroke()}
function bindClip(c,el){
  let down=false,ox=0,start0=0;
  el.addEventListener('pointerdown',e=>{e.preventDefault();selectedClip=c.id;down=true;ox=e.clientX;start0=c.start;el.setPointerCapture?.(e.pointerId);renderBuild()},{passive:false});
  window.addEventListener('pointermove',e=>{if(!down)return;e.preventDefault();c.start=snapTime(start0+(e.clientX-ox)/PX);el.style.left=(c.start*PX)+'px'},{passive:false});
  window.addEventListener('pointerup',()=>down=false,{passive:false});
}
function selected(){return build.find(c=>c.id===selectedClip)}
$('#pitchDown').onclick=()=>{let c=selected();if(!c)return;c.pitch=clamp(c.pitch-1,-24,24);renderBuild()};
$('#pitchUp').onclick=()=>{let c=selected();if(!c)return;c.pitch=clamp(c.pitch+1,-24,24);renderBuild()};
$('#duplicate').onclick=()=>{let c=selected();if(!c)return;let n={...c,id:crypto.randomUUID?.()||Math.random().toString(36),start:c.start+c.duration/Math.pow(2,c.pitch/12)};build.push(n);selectedClip=n.id;renderBuild();ui()};
$('#deleteClip').onclick=()=>{build=build.filter(c=>c.id!==selectedClip);selectedClip=null;renderBuild();ui()};

function stopBuild(){for(const s of buildSources){try{s.stop()}catch{}}buildSources=[];cancelAnimationFrame(buildRAF);$('#buildHead').style.transform='translateX(0)'}
$('#buildPlay').onclick=()=>{if(!build.length)return;ctx();stopBuild();buildStartedAt=ac.currentTime+.05;for(const c of build){let s=ac.createBufferSource(),rate=Math.pow(2,c.pitch/12);s.buffer=c.buf;s.playbackRate.value=rate;s.connect(master);s.start(buildStartedAt+c.start,c.srcStart,c.duration);buildSources.push(s)}tickBuild()};
$('#buildStop').onclick=stopBuild;
function tickBuild(){let t=Math.max(0,ac.currentTime-buildStartedAt);$('#buildHead').style.transform='translateX('+(t*PX)+'px)';buildRAF=requestAnimationFrame(tickBuild)}
$('#bpm').oninput=renderBuild;$('#snap').onchange=()=>{};

function ui(){
  const ok=!!buffer;['play','stop','rec'].forEach(id=>$('#'+id).disabled=!ok);$('#dur').textContent=ok?fmt(buffer.duration):'00:00.000';
  $('#rec').classList.toggle('danger',recording);$('#rec').classList.toggle('primary',!recording);$('#rec').innerHTML=recording?'<span class="recDot"></span>STOP':'<span class="recDot"></span>TAKE';
  $('#recBadge').classList.toggle('on',recording);
}
(function tick(){if(buffer){const x=current()/buffer.duration*sourceWrap.clientWidth;sourceWrap.querySelector('.playhead').style.transform='translateX('+x+'px)';$('#now').textContent=fmt(current())}requestAnimationFrame(tick)})();
window.addEventListener('resize',()=>{if(buffer)drawWave(buffer,sourceWrap);renderTakes();renderBuild()});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
drawWave(null,sourceWrap);renderBuild();ui();
</script>
</body></html>
