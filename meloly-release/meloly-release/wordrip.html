<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WORDRIP</title>
<style>
:root {
    --font-notebook:'Yu Mincho','YuMincho','Hiragino Mincho ProN',serif;
    --font-ui:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
    --font-size-multiplier:1.0;
    --text-word-glow:0 0 8px rgba(255,255,255,0.2);
    --c-muted:rgba(255,255,255,0.25);
    --c-hover:rgba(255,255,255,0.7);
    --c-accent:#38bdf8;
    --c-mode-btn:rgba(255,255,255,0.55);
    --c-mode-border:rgba(255,255,255,0.18);
    --c-mode-bg:rgba(255,255,255,0.06);
}
[data-theme="light"]{
    --text-word-glow:none;
    --c-muted:rgba(0,0,0,0.25);
    --c-hover:rgba(0,0,0,0.6);
    --c-accent:#4a5d78;
    --c-mode-btn:rgba(60,80,100,0.7);
    --c-mode-border:rgba(60,80,100,0.25);
    --c-mode-bg:rgba(60,80,100,0.07);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font-ui);}
body{background:linear-gradient(135deg,#05070a 0%,#0f131c 100%);transition:background 0.8s;}
[data-theme="light"] body{background:linear-gradient(135deg,#e8eae8 0%,#f5f5f3 100%);}

.particle-field{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.window-glass{position:absolute;width:100%;height:100%;top:0;left:0;backdrop-filter:blur(3px);z-index:2;pointer-events:none;}
.rain-words-container{position:absolute;width:100%;height:100%;top:0;left:0;z-index:3;overflow:hidden;pointer-events:none;}

.dripping-word{position:absolute;font-family:var(--font-notebook);color:rgba(226,232,240,0.75);white-space:nowrap;user-select:none;pointer-events:none;text-shadow:var(--text-word-glow);font-size:calc(1.05rem * var(--font-size-multiplier));}
[data-theme="light"] .dripping-word{color:rgba(44,48,56,0.8);}
.style-plant{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:6px;animation-name:fall-down;animation-timing-function:linear;animation-iteration-count:1;animation-fill-mode:forwards;}
@keyframes fall-down{0%{transform:translateY(-150px)}100%{transform:translateY(105vh)}}
.style-star{writing-mode:horizontal-tb;letter-spacing:4px;font-weight:200;animation-name:star-twinkle;animation-timing-function:ease-in-out;animation-fill-mode:both;}
@keyframes star-twinkle{0%,100%{opacity:0;transform:scale(0.82)}50%{opacity:var(--target-opacity);transform:scale(1)}}
.bg-star{position:absolute;border-radius:50%;background:#fff;opacity:0;animation-name:bg-twinkle;animation-timing-function:ease-in-out;animation-iteration-count:infinite;}
@keyframes bg-twinkle{0%,100%{opacity:0;transform:scale(0.5)}50%{opacity:0.9;transform:scale(1.25);box-shadow:0 0 5px rgba(255,255,255,0.85)}}
.rain-drop{position:absolute;top:0;width:1.4px;border-radius:2px;background:linear-gradient(to bottom,rgba(90,110,140,0) 0%,rgba(70,90,120,0.55) 100%);animation-name:drop-fall;animation-timing-function:linear;animation-iteration-count:infinite;}
@keyframes drop-fall{0%{transform:translateY(-140px)}100%{transform:translateY(108vh)}}

/* 閉じるボタン */
.close-btn{
    position:fixed;top:16px;right:20px;z-index:1000;
    background:transparent;border:none;cursor:pointer;
    color:var(--c-muted);padding:6px;
    display:flex;align-items:center;justify-content:center;
    transition:color 0.2s;
}
.close-btn:hover{color:var(--c-hover);}

/* HUD 右下 */
.hud{position:fixed;bottom:24px;right:24px;z-index:1000;display:flex;align-items:center;gap:8px;}
.hud-btn{
    background:transparent;border:none;cursor:pointer;
    color:var(--c-muted);padding:5px 8px;
    display:flex;align-items:center;gap:5px;
    transition:color 0.2s;
    font-size:9px;letter-spacing:1px;font-family:var(--font-ui);
}
.hud-btn:hover{color:var(--c-hover);}
.hud-btn.active{color:var(--c-accent);}
.hud-btn.active .sound-label{font-weight:700;letter-spacing:1.5px;}
.sound-off-line{display:none;}
.hud-btn:not(.active) .sound-off-line{display:block;}
.hud-btn:not(.active) .sound-waves{display:none;}
.hud-sep{width:1px;height:14px;background:var(--c-muted);opacity:0.3;}

/* 設定ボタン（右下、歯車のみ） */
.settings-btn{
    background:transparent;border:none;cursor:pointer;
    color:var(--c-muted);padding:5px;
    display:flex;align-items:center;justify-content:center;
    transition:color 0.2s;
}
.settings-btn:hover{color:var(--c-hover);}
.settings-btn.active{color:var(--c-accent);}

/* モード切替ボタン（中央下） */
.hud-center{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:1000;}
.mode-btn{
    background:var(--c-mode-bg);
    border:1px solid var(--c-mode-border);
    color:var(--c-mode-btn);
    cursor:pointer;
    padding:7px 18px;
    border-radius:20px;
    display:flex;align-items:center;gap:7px;
    transition:all 0.2s;
    font-size:9px;letter-spacing:1.5px;font-family:var(--font-ui);
    backdrop-filter:blur(8px);
}
.mode-btn:hover{
    color:var(--c-hover);
    border-color:var(--c-mode-btn);
    background:var(--c-mode-bg);
}

/* スライダーポップアップ（右下から上に出る） */
.slider-popup{
    position:fixed;bottom:64px;right:24px;z-index:999;
    background:rgba(10,14,22,0.92);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:14px;padding:16px 20px;
    display:none;flex-direction:column;gap:12px;
    min-width:220px;
    animation:popUpRight 0.18s ease;
}
[data-theme="light"] .slider-popup{background:rgba(240,239,236,0.95);border:1px solid rgba(0,0,0,0.08);}
.slider-popup.open{display:flex;}
@keyframes popUpRight{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.sp-section{display:flex;flex-direction:column;gap:8px;}
.sp-divider{height:1px;background:rgba(255,255,255,0.06);}
[data-theme="light"] .sp-divider{background:rgba(0,0,0,0.08);}
.sp-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.sp-label{font-size:8px;letter-spacing:1.5px;color:var(--c-muted);font-weight:700;text-transform:uppercase;white-space:nowrap;min-width:52px;}
.sp-label.sound{color:rgba(168,85,247,0.7);}
[data-theme="light"] .sp-label.sound{color:rgba(160,80,40,0.7);}
.cs-wrap{position:relative;width:80px;height:14px;cursor:pointer;display:inline-block;touch-action:none;flex:none;}
.cs-track{position:absolute;top:50%;left:0;width:100%;height:2px;margin-top:-1px;background:rgba(128,128,128,0.2);border-radius:1px;}
.cs-thumb{position:absolute;top:50%;left:0;width:9px;height:9px;margin-top:-4.5px;margin-left:-4.5px;border-radius:50%;background:rgba(255,255,255,0.7);pointer-events:none;transition:left 0.05s;}
[data-theme="light"] .cs-thumb{background:rgba(0,0,0,0.5);}

/* スマホ幅（600px以下）の時だけ、ボタンをタップしやすい大きさにする。PC表示には影響しない */
@media (max-width: 600px){
    .close-btn{padding:12px;}
    .close-btn svg{width:20px;height:20px;}

    .hud{bottom:max(24px, env(safe-area-inset-bottom));gap:10px;}
    .hud-btn{padding:10px 12px;font-size:12px;}
    .hud-btn svg{width:18px;height:18px;}
    .hud-sep{height:20px;}

    .settings-btn{padding:10px;}
    .settings-btn svg{width:23px;height:23px;}

    .hud-center{bottom:max(78px, calc(env(safe-area-inset-bottom) + 78px));}
    .mode-btn{padding:11px 22px;font-size:12px;gap:9px;}
    .mode-btn svg{width:19px;height:19px;}

    .cs-wrap{width:100px;height:24px;}
    .cs-thumb{width:14px;height:14px;margin-top:-7px;margin-left:-7px;}
    .sp-label{font-size:10px;min-width:62px;}
}
</style>
</head>
<body>
<div class="particle-field" id="particleField"></div>
<div class="window-glass"></div>
<div class="rain-words-container" id="rainWordsContainer"></div>

<!-- 閉じるボタン -->
<button class="close-btn" onclick="window.close()" title="閉じる">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <line x1="2" y1="2" x2="12" y2="12"/>
        <line x1="12" y1="2" x2="2" y2="12"/>
    </svg>
</button>

<!-- モード切替ボタン 中央下 -->
<div class="hud-center">
    <button class="mode-btn" id="modeBtn" onclick="window._wordrip.toggleTheme()">
        <!-- STARモード時（dark）→傘アイコン表示（RAINに切り替えるイメージ） -->
        <svg id="iconUmbrella" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 8 Q1 2 8 2 Q15 2 15 8Z" fill="currentColor" stroke="none" opacity="0.5"/>
            <path d="M1 8 Q1 2 8 2 Q15 2 15 8"/>
            <path d="M10 10 Q10 13 8 13 Q6 13 6 11"/>
        </svg>
        <!-- RAINモード時（light）→月アイコン表示（STARに切り替えるイメージ） -->
        <svg id="iconMoonMode" width="15" height="15" viewBox="0 0 16 16" fill="currentColor" stroke="none" style="display:none;" opacity="0.8">
            <path d="M13 10 Q7 12 5 6 Q3 0 9 2 Q4 4 6 9 Q8 13 13 10Z"/>
        </svg>
        <span id="modeBtnLabel">RAIN</span>
    </button>
</div>

<!-- HUD 右下：sound / セパレータ / 設定歯車 -->
<div class="hud">
    <button class="hud-btn" id="soundBtn" onclick="window._wordrip.toggleSound()">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
            <polygon points="1,4 4,4 7,2 7,12 4,10 1,10" fill="currentColor" stroke="none" opacity="0.8"/>
            <g class="sound-waves">
                <path d="M9 4.5 Q11 7 9 9.5" opacity="0.6"/>
                <path d="M10.5 3 Q13.5 7 10.5 11" opacity="0.3"/>
            </g>
            <line class="sound-off-line" x1="1" y1="13" x2="13" y2="1" stroke-width="1" opacity="0.5"/>
        </svg>
        <span class="sound-label">sound</span>
    </button>
    <div class="hud-sep"></div>
    <button class="settings-btn" id="settingsBtn" onclick="window._wordrip.toggleSettings()" title="settings">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
            <line x1="2" y1="4.5" x2="14" y2="4.5"/><circle cx="9.5" cy="4.5" r="1.6" fill="currentColor" stroke="none"/>
            <line x1="2" y1="8" x2="14" y2="8"/><circle cx="6" cy="8" r="1.6" fill="currentColor" stroke="none"/>
            <line x1="2" y1="11.5" x2="14" y2="11.5"/><circle cx="11" cy="11.5" r="1.6" fill="currentColor" stroke="none"/>
        </svg>
    </button>
</div>

<!-- スライダーポップアップ -->
<div class="slider-popup" id="sliderPopup">
    <div class="sp-section">
        <div class="sp-row"><span class="sp-label" id="lblGlide">星</span><div class="cs-wrap" id="glideSlider"><div class="cs-track"></div><div class="cs-thumb"></div></div></div>
        <div class="sp-row"><span class="sp-label">頻度</span><div class="cs-wrap" id="rateSlider"><div class="cs-track"></div><div class="cs-thumb"></div></div></div>
        <div class="sp-row"><span class="sp-label">速さ</span><div class="cs-wrap" id="speedSlider"><div class="cs-track"></div><div class="cs-thumb"></div></div></div>
        <div class="sp-row"><span class="sp-label">サイズ</span><div class="cs-wrap" id="sizeSlider"><div class="cs-track"></div><div class="cs-thumb"></div></div></div>
        <div class="sp-row"><span class="sp-label">ぼかし</span><div class="cs-wrap" id="blurSlider"><div class="cs-track"></div><div class="cs-thumb"></div></div></div>
    </div>
    <div class="sp-divider"></div>
    <div class="sp-section">
        <div class="sp-row"><span class="sp-label sound" id="lblVol1">環境音</span><div class="cs-wrap" id="rainVolSlider"><div class="cs-track"></div><div class="cs-thumb"></div></div></div>
        <div class="sp-row"><span class="sp-label sound" id="lblVol2">音色</span><div class="cs-wrap" id="pianoVolSlider"><div class="cs-track"></div><div class="cs-thumb"></div></div></div>
    </div>
</div>

<script>
(function(){
    // 起動テーマをURLパラメータから取得
    const urlParams=new URLSearchParams(window.location.search);
    const initTheme=urlParams.get('theme')||'dark';
    document.documentElement.setAttribute('data-theme',initTheme);

    let stockWords=["君と夏を","意味の無い事","静寂","記憶の街","スコール","ノイズ","冷たい光","残響","夜明け","透明"];
    try{const s=localStorage.getItem('wordrip_words');if(s){const w=JSON.parse(s);if(w&&w.length)stockWords=w;}}catch(e){}

    let audioCtx=null,masterGain=null,ambientGain=null,toneGain=null;
    let rainInterval=null,pianoTimeout=null,dropTimeout=null,cricketTimeout=null;
    let rainSources=[],lfos=[];
    // 環境音デフォルト音量を小さめに
    let currentGlide=70,currentRate=700,currentAmbientVol=0.12,currentToneVol=0.10,currentSpeed=1.0,currentBlurMax=0.6,audioStarted=false;
    const root=document.documentElement;
    function isLight(){return root.getAttribute('data-theme')==='light';}

    // スライダー（ポップアップopen後に初期化）
    let slidersInited=false;
    function makeSlider(id,opts){
        const el=document.getElementById(id);if(!el)return;
        const thumb=el.querySelector('.cs-thumb');
        const{min,max,step,value:iv,onInput,onChange}=opts;
        const dec=(String(step).split('.')[1]||'').length;
        let value=iv,drag=false;
        function setV(){thumb.style.left=((value-min)/(max-min)*100)+'%';}
        function fromX(cx){const r=el.getBoundingClientRect();const ratio=Math.max(0,Math.min(1,(cx-r.left)/r.width));return parseFloat(Math.max(min,Math.min(max,Math.round((min+ratio*(max-min))/step)*step)).toFixed(dec));}
        el.addEventListener('pointerdown',e=>{drag=true;value=fromX(e.clientX);setV();if(onInput)onInput(value);e.preventDefault();});
        document.addEventListener('pointermove',e=>{if(!drag)return;value=fromX(e.clientX);setV();if(onInput)onInput(value);});
        document.addEventListener('pointerup',()=>{if(!drag)return;drag=false;if(onChange)onChange(value);});
        setV();
    }
    function initSliders(){
        if(slidersInited)return;
        slidersInited=true;
        makeSlider('glideSlider',{min:0,max:200,step:5,value:currentGlide,onChange:v=>{currentGlide=v;buildParticles();}});
        makeSlider('rateSlider',{min:1,max:20,step:1,value:6,onChange:v=>{currentRate=Math.round(4200/v);clearInterval(rainInterval);startWords();}});
        makeSlider('speedSlider',{min:0.2,max:3,step:0.1,value:currentSpeed,onChange:v=>{currentSpeed=v;if(isLight())buildParticles();}});
        makeSlider('sizeSlider',{min:0.4,max:2.5,step:0.1,value:1,onInput:v=>root.style.setProperty('--font-size-multiplier',v)});
        makeSlider('blurSlider',{min:0,max:4,step:0.1,value:currentBlurMax,onInput:v=>{currentBlurMax=v;}});
        makeSlider('rainVolSlider',{min:0,max:1,step:0.01,value:currentAmbientVol,onInput:v=>{currentAmbientVol=v;if(ambientGain&&audioCtx)ambientGain.gain.setValueAtTime(v,audioCtx.currentTime);}});
        makeSlider('pianoVolSlider',{min:0,max:0.5,step:0.01,value:currentToneVol,onInput:v=>{currentToneVol=v;}});
    }

    // 単語アニメーション
    function startWords(){
        clearInterval(rainInterval);
        const c=document.getElementById('rainWordsContainer');
        rainInterval=setInterval(()=>{
            if(window.opener&&!window.opener.closed){
                try{window.opener.postMessage({type:'REQUEST_WORD'},'*');}catch(e){}
            }
            spawnWord(c,isLight());
        },currentRate);
    }

    function spawnWord(c,light,overrideWord){
        const d=document.createElement('div');d.className='dripping-word';
        d.textContent=overrideWord||stockWords[Math.floor(Math.random()*stockWords.length)];
        d.style.left=(Math.random()*90+5)+'vw';
        const blurVal=Math.random()<0.4?Math.random()*currentBlurMax*2:0;
        if(blurVal>0.05)d.style.filter=`blur(${blurVal.toFixed(1)}px)`;
        if(light){
            d.classList.add('style-plant');
            d.style.animationDuration=((6+Math.random()*8)/currentSpeed)+'s';
            d.addEventListener('animationend',()=>d.remove());
        }else{
            d.classList.add('style-star');
            d.style.top=(Math.random()*80+5)+'vh';
            d.style.setProperty('--target-opacity',0.3+Math.random()*0.5);
            d.style.animationDuration=((2.6+Math.random()*2.4)/currentSpeed)+'s';
            d.style.animationIterationCount=2+Math.floor(Math.random()*3);
            d.addEventListener('animationend',()=>d.remove());
        }
        c.appendChild(d);
        setTimeout(()=>{try{d.remove();}catch(e){}},30000);
    }

    function buildParticles(){
        const f=document.getElementById('particleField');f.innerHTML='';
        if(isLight()){
            for(let i=0;i<Math.round(currentGlide*1.8);i++){
                const d=document.createElement('div');d.className='rain-drop';
                d.style.height=(28+Math.random()*55)+'px';
                d.style.left=(Math.random()*100)+'vw';
                d.style.animationDuration=((0.5+Math.random()*0.55)/currentSpeed)+'s';
                d.style.animationDelay=(Math.random()*2.2)+'s';
                d.style.opacity=(0.22+Math.random()*0.45).toFixed(2);
                f.appendChild(d);
            }
        }else{
            for(let i=0;i<currentGlide;i++){
                const s=document.createElement('div');s.className='bg-star';
                const sz=1+Math.random()*2.2;s.style.width=sz+'px';s.style.height=sz+'px';
                s.style.left=(Math.random()*100)+'vw';s.style.top=(Math.random()*100)+'vh';
                s.style.animationDuration=(2.5+Math.random()*5)+'s';
                s.style.animationDelay=(Math.random()*6)+'s';
                f.appendChild(s);
            }
        }
    }

    // 音の生成
    function initAudio(){
        try{
            if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
            masterGain=audioCtx.createGain();masterGain.gain.value=1;masterGain.connect(audioCtx.destination);
            ambientGain=audioCtx.createGain();ambientGain.gain.setValueAtTime(0,audioCtx.currentTime);ambientGain.connect(masterGain);
            toneGain=audioCtx.createGain();toneGain.gain.value=1;toneGain.connect(masterGain);
            rainSources=[];lfos=[];
        }catch(e){}
    }

    function playNote(){
        if(!audioCtx||currentToneVol===0)return;
        const light=isLight();
        const scale=[185,220,277.18,329.63,369.99,440,554.37,659.25];
        let freq=scale[Math.floor(Math.random()*scale.length)];
        if(!light)freq*=4;
        const now=audioCtx.currentTime;
        const o1=audioCtx.createOscillator(),o2=audioCtx.createOscillator(),g1=audioCtx.createGain(),g2=audioCtx.createGain();
        o1.type='sine';o1.frequency.value=freq;o2.type='triangle';o2.frequency.value=freq*2;
        if(light){
            g1.gain.setValueAtTime(0,now);g1.gain.linearRampToValueAtTime(currentToneVol*0.4,now+0.01);g1.gain.exponentialRampToValueAtTime(0.001,now+4.5);
            g2.gain.setValueAtTime(0,now);g2.gain.linearRampToValueAtTime(currentToneVol*0.1,now+0.005);g2.gain.exponentialRampToValueAtTime(0.001,now+0.3);
        }else{
            g1.gain.setValueAtTime(0,now);g1.gain.linearRampToValueAtTime(currentToneVol*0.25,now+0.005);g1.gain.exponentialRampToValueAtTime(0.001,now+2);
            g2.gain.setValueAtTime(0,now);g2.gain.linearRampToValueAtTime(currentToneVol*0.05,now+0.002);g2.gain.exponentialRampToValueAtTime(0.001,now+0.1);
        }
        o1.connect(g1);g1.connect(toneGain);o2.connect(g2);g2.connect(toneGain);
        o1.start(now);o2.start(now);o1.stop(now+5);o2.stop(now+5);
    }
    function pianoLoop(){pianoTimeout=setTimeout(()=>{playNote();pianoLoop();},3000+Math.random()*4000);}

    function makeNoise(){
        const buf=audioCtx.createBuffer(1,2*audioCtx.sampleRate,audioCtx.sampleRate);
        const out=buf.getChannelData(0);for(let i=0;i<buf.length;i++)out[i]=Math.random()*2-1;
        const src=audioCtx.createBufferSource();src.buffer=buf;src.loop=true;return src;
    }
        function startAmbient(){
        ambientGain.gain.cancelScheduledValues(audioCtx.currentTime);
        ambientGain.gain.setValueAtTime(0,audioCtx.currentTime);
        ambientGain.gain.linearRampToValueAtTime(currentAmbientVol,audioCtx.currentTime+0.5);
        rainSources=[];lfos=[];
        if(isLight()){
            const s=makeNoise(),hp=audioCtx.createBiquadFilter(),lp=audioCtx.createBiquadFilter(),g=audioCtx.createGain();
            hp.type='highpass';hp.frequency.value=420;lp.type='lowpass';lp.frequency.value=5200;g.gain.value=0.5;
            s.connect(hp);hp.connect(lp);lp.connect(g);g.connect(ambientGain);s.start();rainSources.push(s);
            const dr=makeNoise(),bp=audioCtx.createBiquadFilter(),dg=audioCtx.createGain();
            bp.type='bandpass';bp.frequency.value=2600;bp.Q.value=0.7;dg.gain.value=0.1;
            dr.connect(bp);bp.connect(dg);dg.connect(ambientGain);dr.start();rainSources.push(dr);
        }else{
            const b=makeNoise(),blp=audioCtx.createBiquadFilter(),bg=audioCtx.createGain();
            blp.type='lowpass';blp.frequency.value=900;bg.gain.value=0.16;
            b.connect(blp);blp.connect(bg);bg.connect(ambientGain);b.start();rainSources.push(b);
            [{f:3200,q:2.5,lfo:6.5,d:0.5,v:0.07},{f:4200,q:2.2,lfo:8.5,d:0.5,v:0.055},{f:5100,q:2.0,lfo:5.2,d:0.45,v:0.04}].forEach(ins=>{
                const s=makeNoise(),ibp=audioCtx.createBiquadFilter(),g=audioCtx.createGain();
                ibp.type='bandpass';ibp.frequency.value=ins.f;ibp.Q.value=ins.q;g.gain.value=ins.v;
                const lfo=audioCtx.createOscillator(),lg=audioCtx.createGain();
                lfo.type='sine';lfo.frequency.value=ins.lfo;lg.gain.value=ins.v*ins.d;
                lfo.connect(lg);lg.connect(g.gain);lfo.start();
                s.connect(ibp);ibp.connect(g);g.connect(ambientGain);s.start();
                rainSources.push(s);lfos.push(lfo);
            });
        }
    }
    function stopAmbient(){
        clearTimeout(dropTimeout);clearTimeout(cricketTimeout);
        rainSources.forEach(s=>{try{s.stop();s.disconnect();}catch(e){}});
        lfos.forEach(l=>{try{l.stop();l.disconnect();}catch(e){}});
        rainSources=[];lfos=[];
        if(ambientGain&&audioCtx)ambientGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.3);
    }

    function updateHUD(){
        const light=isLight();
        // モード切替ボタン：darkのとき傘（RAINへの切り替え）、lightのとき月（STARへの切り替え）
        document.getElementById('iconUmbrella').style.display=light?'none':'block';
        document.getElementById('iconMoonMode').style.display=light?'block':'none';
        document.getElementById('modeBtnLabel').textContent=light?'STAR':'RAIN';
        // settings
        document.getElementById('lblGlide').textContent=light?'雨':'星';
        document.getElementById('lblVol1').textContent=light?'雨音':'虫の声';
        document.getElementById('lblVol2').textContent=light?'ピアノ':'音色';
        document.title=light?'WORDRIP · あめ':'WORDRIP · ほし';
        // sound
        const sb=document.getElementById('soundBtn');
        const lbl=sb.querySelector('.sound-label');
        if(audioStarted){sb.classList.add('active');lbl.textContent='sound on';}
        else{sb.classList.remove('active');lbl.textContent='sound';}
    }

    window._wordrip={
        toggleTheme(){
            stopAmbient();clearInterval(rainInterval);clearTimeout(pianoTimeout);
            document.getElementById('rainWordsContainer').innerHTML='';
            const next=isLight()?'dark':'light';
            root.setAttribute('data-theme',next);
            buildParticles();startWords();updateHUD();
            if(audioStarted)startAmbient();
        },
        toggleSound(){
            if(!audioStarted){
                if(!audioCtx)initAudio();
                const go=()=>{audioStarted=true;startAmbient();pianoLoop();updateHUD();};
                if(audioCtx.state==='suspended')audioCtx.resume().then(go);else go();
            }else{
                stopAmbient();clearTimeout(pianoTimeout);audioStarted=false;updateHUD();
            }
        },
        toggleSettings(){
            const popup=document.getElementById('sliderPopup');
            const btn=document.getElementById('settingsBtn');
            const isOpen=popup.classList.toggle('open');
            btn.classList.toggle('active',isOpen);
            if(isOpen)setTimeout(initSliders,50);
        }
    };

    document.addEventListener('click',e=>{
        if(!e.target.closest('#sliderPopup')&&!e.target.closest('#settingsBtn')){
            document.getElementById('sliderPopup').classList.remove('open');
            document.getElementById('settingsBtn').classList.remove('active');
        }
    });

    window.addEventListener('message',e=>{
        if(e.data&&e.data.type==='UPDATE_WORDS'&&e.data.words&&e.data.words.length){
            stockWords=e.data.words;
        }
        if(e.data&&e.data.type==='NEW_WORD'&&e.data.word){
            spawnWord(document.getElementById('rainWordsContainer'),isLight(),e.data.word);
        }
    });

    updateHUD();buildParticles();startWords();initAudio();

    const watcher=setInterval(()=>{try{if(window.opener&&window.opener.closed){cleanup();window.close();}}catch(e){}},1000);
    function cleanup(){stopAmbient();clearInterval(rainInterval);clearTimeout(pianoTimeout);clearInterval(watcher);try{if(audioCtx)audioCtx.close();}catch(e){}}
    window.addEventListener('beforeunload',cleanup);
})();
</script>
</body>
</html>
